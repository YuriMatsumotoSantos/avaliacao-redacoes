ssidade de intervenções para sanar o problema.&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de concordância entre o verbo &#x27;é&#x27; e o sujeito &#x27;necessidade&#x27; (deveria ser &#x27;é nítida&#x27;) e falta de regência adequada do verbo &#x27;ser&#x27; com o predicativo.<br><i>Sugestão:<\/i> Com isso, é nítida a necessidade de intervenções para sanar o problema.<\/li>\n<li><span class=c>C2:<\/span> A argumentação permanece genérica; não são apresentados argumentos concretos que sustentem a necessidade de intervenção, o que enfraquece a consistência da defesa do ponto de vista.<br><i>Sugestão:<\/i> Com isso, torna‑se evidente a necessidade de intervenções, como a ampliação de unidades de saúde equipadas para o parto humanizado e a capacitação de profissionais, para sanar o problema.<\/li>\n<\/ul><\/li>\n<li>&ldquo;cabe ao governo federal juntamente com o Ministério da Saúde promover melhorias ao Sistema de Saúde Público, como a criação de salas especiais, garantindo local e atendimento para gestantes, e a criação de hospitais especializados e direcionados humanização do parto.&rdquo;<ul>\n<li><span class=c>C5:<\/span> A proposta não especifica agente, ação, modo/meio, efeito e detalhamento de forma clara e sequencial. Falta indicar quem será responsável pela execução (ex.: secretarias estaduais de saúde), como será feita a capacitação dos profissionais, quais recursos financeiros serão destinados, prazo para implementação e como esses atos reduzirão as cesáreas.<br><i>Sugestão:<\/i> Cabe ao governo federal, em parceria com as secretarias estaduais de saúde, criar, nos próximos dois anos, salas de parto humanizado em todas as unidades básicas do SUS, destinando recursos financeiros específicos para a adaptação de infraestrutura e capacitação de equipes multiprofissionais; além disso, será construído um hospital público referência em parto humanizado a cada região, com equipe especializada, para atender 30% das gestantes do município, reduzindo em 15% o número de cesáreas eletivas nos primeiros três anos.<\/li>\n<\/ul><\/li>\n<li>&ldquo;para minimizar a procura por cesáreas, e para a implementação de partos humanizados&rdquo;<ul>\n<li><span class=c>C3:<\/span> A formulação é redundante e pouco precisa; o uso de &quot;procura&quot; e &quot;implementação&quot; não estabelece claramente a causa‑efeito desejada. A falta de conexão lógica enfraquece a argumentação e a organização das ideias.<br><i>Sugestão:<\/i> para reduzir a taxa de cesáreas e promover a implementação de partos humanizados<\/li>\n<\/ul><\/li>\n<li>&ldquo;para a criação de hospitais especializados e direcionados humanização do parto.&rdquo;<ul>\n<li><span class=c>C1:<\/span> Problema de regência e construção nominal: o termo &#x27;direcionados humanização&#x27; está incorreto; falta preposição e concordância.<br><i>Sugestão:<\/i> para a criação de hospitais especializados e voltados à humanização do parto.<\/li>\n<li><span class=c>C2:<\/span> A proposta de intervenção está incompleta e pouco articulada; falta especificar como a criação desses hospitais contribuirá para a solução do problema, reduzindo a previsibilidade da argumentação.<br><i>Sugestão:<\/i> para a criação de hospitais especializados que priorizem a humanização do parto, oferecendo salas adequadas, equipes multidisciplinares e acompanhamento contínuo das gestantes.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Nesse sentido, no que tange à questão do parto humanizado, percebe-se a configuração de um grave problema na saúde pública em virtude das condições precárias do SUS - Sistema de Saúde Público- e a escassez de hospitais especializados para a realização de tal procedimento.&rdquo;<ul>\n<li><span class=c>C4:<\/span> A sequência de conectivos &quot;Nesse sentido, no que tange à&quot; cria sobrecarga e dificulta a fluidez entre as partes do texto. Além disso, a conjunção &quot;e&quot; une duas causas distintas sem clareza, prejudicando a articulação lógica.<br><i>Sugestão:<\/i> Nesse sentido, ao analisar a questão do parto humanizado, percebe‑se um grave problema na saúde pública, decorrente das condições precárias do SUS – Sistema Único de Saúde – e da escassez de hospitais especializados para a realização desse procedimento.<\/li>\n<\/ul><\/li>\n<\/ol><h3>Como melhorar<\/h3><ul>\n<li><span class=c>C1:<\/span> Revisar cuidadosamente as construções de concordância nominal e verbal, especialmente em frases que iniciam com locuções prepositivas (ex.: &#x27;Devido à falta...&#x27;).<\/li>\n<li><span class=c>C1:<\/span> Atentar para a regência dos verbos e a necessidade de preposições que completam o sentido (ex.: &#x27;voltados à humanização&#x27;).<\/li>\n<li><span class=c>C1:<\/span> Praticar a pontuação em períodos longos, inserindo vírgulas onde houver mudança de sujeito ou de ideia, para evitar ambiguidades e melhorar a fluidez do texto.<\/li>\n<li><span class=c>C2:<\/span> Desenvolva argumentos com dados ou exemplos concretos que demonstrem a relação entre a falta de estrutura e o aumento das cesáreas, tornando a argumentação mais consistente.<\/li>\n<li><span class=c>C2:<\/span> Estruture a proposta de intervenção de forma detalhada, indicando responsáveis, prazos e recursos necessários, para que a conclusão vá além de uma simples sugestão.<\/li>\n<li><span class=c>C2:<\/span> Varie os conectivos argumentativos (por exemplo, &quot;além disso&quot;, &quot;consequentemente&quot;, &quot;por isso&quot;) para melhorar a coesão e evitar repetições que tornam a argumentação previsível.<\/li>\n<li><span class=c>C3:<\/span> Estruture os argumentos em parágrafos bem delimitados, iniciando cada um com uma ideia‑principal clara e desenvolvendo-a com fatos e exemplos concretos.<\/li>\n<li><span class=c>C3:<\/span> Utilize conectivos lógicos (por exemplo, &quot;consequentemente&quot;, &quot;além disso&quot;, &quot;por isso&quot;) para estabelecer relações de causa‑efeito entre as informações apresentadas.<\/li>\n<li><span class=c>C3:<\/span> Revise a escolha lexical, evitando construções vagas ou redundantes, e assegure que cada informação contribua diretamente para a defesa do ponto de vista defendido.<\/li>\n<li><span class=c>C4:<\/span> Use conectivos que indiquem explicitamente a relação entre as ideias (por exemplo, &quot;por isso&quot;, &quot;consequentemente&quot;, &quot;devido a&quot;).<\/li>\n<li><span class=c>C4:<\/span> Evite empilhar expressões de transição; escolha a mais adequada para cada passagem e mantenha a frase enxuta.<\/li>\n<li><span class=c>C4:<\/span> Revisite a estrutura das sentenças longas, dividindo-as quando necessário, para que cada segmento tenha um único núcleo de sentido e a referência entre eles fique clara.<\/li>\n<li><span class=c>C5:<\/span> Estruture a proposta seguindo o esquema agente‑ação‑modo/meio‑efeito, indicando claramente quem executa, o que será feito, como será feito e qual o resultado esperado.<\/li>\n<li><span class=c>C5:<\/span> Inclua prazos, metas quantitativas e recursos financeiros ou humanos específicos, demonstrando viabilidade e mensurabilidade da intervenção.<\/li>\n<li><span class=c>C5:<\/span> Conecte cada elemento da proposta à argumentação desenvolvida nos parágrafos anteriores, mostrando como a medida responde diretamente às causas apontadas (falta de infraestrutura, escassez de profissionais, etc.).<\/li>\n<\/ul>"}, {"cod": "F06", "tema": "Reforma da Previdência: uma solução ou um problema?", "titulo": "Uma reforma sem efeito", "motivadores": "<p>Reforma da Previdência Social, ou simplesmente Reforma Previdenciária, é uma reforma estrutural que visa à implementação de medidas legislativas que venham a alterar substantivamente a legislação previdenciária de um país. No Brasil, a previdência social está no âmbito do programa de seguridade social. É sustentada principalmente por meio do recolhimento ao INSS, pelas empresas, de 20% sobre o valor das remunerações pagas a cada mês, aos empregados. Desses 20%, a empresa desconta 8% a 11% da remuneração do trabalhador enquanto este trabalha.Os servidores públicos pagam de 11% a 14% sobre o seu salário e empregador deste os mesmos percentuais. [Wikipédia] Leia o texto na íntegra \nDo ponto de vista de justiça social e igualdade no financiamento a PEC é positiva, pois prevê a criação de alíquotas diferenciadas por faixa de remuneração, fazendo com que aqueles que ganham mais paguem contribuições previdenciárias com maiores alíquotas, diminuindo as alíquotas dos que ganham menos.\nAlém das alíquotas progressivas por faixa de rendimentos, a proposta prevê a criação de um fundo para cuidar do déficit e gerir eventual superávit e, ainda, contribuições extraordinárias que serão instituídas por lei complementar com o objetivo de arrecadar fundos para equilibrar o caixa. Tais alíquotas tem previsão de vigência de 20 anos. Havendo superávit a cobrança poderá ser suspensa. [Estadão] Leia o texto na íntegra\nA reforma da Previdência proposta pelo governo de Jair Bolsonaro pode apertar demais os direitos sociais e acabar gerando problemas maiores, com aumento de pobreza no médio e longo prazo.  O estabelecimento de um tempo mínimo de contribuição de 20 anos, o endurecimento na concessão das aposentadorias rurais e as reduções nos valores de pensões e auxílios estão entre as principais críticas. No geral, são regras que dificultam o acesso e resultam em pagamentos menores do que os recebidos hoje. [UOL] Leia o texto na íntegra\n<\/p>", "paragrafos": ["Mais uma vez sofremos os transtornos de uma nova reforma da previdência social. A pergunta que não quer calar é, será que realmente vale a pena?", "Sabemos que nosso país precisa de mudanças para se estabilizar e crescer e esperamos que essa reforma ajude a população. Mas há muitos pontos que devemos observar antes de declarar qualquer posição.", "O país está envelhecendo rapidamente e a taxa de natalidade diminuiu bastante, esse é um dos motivos da reforma da previdência.", "Mesmo tendo, aparentemente, boas intenções para essa reforma e acabando com privilégios, que pelas regras propostas, quem ganha mais deve contribuir mais com o sistema de aposentadorias. Há um grande porém que não podemos descartar. O fato de que essa nova reforma dificultou bastante a aposentaria de todos já que a proposta do governo de aposentadoria por idade (65 anos) é muito alta e próxima da média de expectativa de vida de algumas pessoas. Como atualmente o nível de desemprego e de trabalhadores aumentou, fica mais difícil para essas pessoas, mais pobres, conseguirem se aposentar com um tempo de contribuição maior (de 20 anos), sem falar do fato das mulheres, que por conta da dupla jornada, passam muito tempo no mercado informal, ou até precisam parar de trabalhar por alguns anos para cuidar dos filhos. Tem também a proposta que prevê que o Benefício de Prestação Continuada (BPC), destinado à idosos que não têm direito à previdência ou com deficiência, seja de apenas 400 reais entre 60 e 69 anos, e somente com 70 anos o idoso receberia um salário mínimo. Isso com certeza deixaria milhares de idosos na miséria, pois aqueles que recebem o benefício não têm condições de se sustentar sem o BPC. Isso tudo é um grande problema se pararmos para pensar.", "Sabemos que já era difícil antes, agora com certeza ficou mais.", "Acredito que pode-se melhorar sem prejudicar os trabalhadores que se esforçam tanto para se manter.", "Há muitos meios que o governo pode utilizar para se adequar a essa nova faze do Brasil. Como por exemplo, cortar gastos desnecessário, diminuir salários muito altos (como de deputados, veradores etc.), cobrar dívidas previdenciárias de grandes empresas e impedir a desvinculação de receitas destinadas a programas sociais e previdenciários.", "Como podemos ver, muito pode-se fazer sem prejudicar os trabalhadores."], "sistema": {"C1": 120, "C2": 120, "C3": 120, "C4": 120, "C5": 120}, "feedback": "<h3>Pontos fortes<\/h3><ul>\n<li><span class=c>C1:<\/span> Apresentou argumentos relevantes e contextualizados sobre a reforma da previdência, demonstrando compreensão do tema.<\/li>\n<li><span class=c>C1:<\/span> Utilizou conectivos que dão coesão ao texto, como &quot;como podemos ver&quot; e &quot;há muitos meios&quot;.<\/li>\n<li><span class=c>C2:<\/span> Apresenta proposta de solução ao apontar medidas como corte de gastos e cobrança de dívidas previdenciárias, demonstrando tentativa de desenvolver o tema.<\/li>\n<li><span class=c>C2:<\/span> Mantém coerência temática ao discutir os impactos da reforma sobre diferentes grupos (idosos, mulheres, trabalhadores informais).<\/li>\n<li><span class=c>C3:<\/span> Apresenta dados demográficos (envelhecimento da população e queda da natalidade) que são relevantes ao tema.<\/li>\n<li><span class=c>C3:<\/span> Defende um ponto de vista claro: a reforma traz problemas e precisa ser aprimorada.<\/li>\n<li><span class=c>C4:<\/span> O texto apresenta conectivos que indicam contraste e causa, como &quot;mas&quot; e &quot;há um grande porém&quot;, o que demonstra alguma preocupação em articular ideias.<\/li>\n<li><span class=c>C4:<\/span> Há tentativa de retomar o tema ao longo do texto, mantendo a coerência temática sobre a reforma da previdência.<\/li>\n<li><span class=c>C5:<\/span> Você conseguiu relacionar a proposta de intervenção ao problema central da reforma da previdência, mostrando que há necessidade de medidas para proteger os trabalhadores mais vulneráveis.<\/li>\n<li><span class=c>C5:<\/span> A sua argumentação apresenta elementos de causa e consequência, o que demonstra compreensão da complexidade do tema.<\/li>\n<\/ul><h3>O que corrigir, trecho a trecho<\/h3><ol>\n<li>&ldquo;A pergunta que não quer calar é, será que realmente vale a pena?&rdquo;<ul>\n<li><span class=c>C2:<\/span> A formulação da pergunta não se conecta diretamente ao desenvolvimento argumentativo; funciona como um recurso retórico solto que não avança a tese nem delimita claramente a posição a ser defendida.<br><i>Sugestão:<\/i> A reforma da Previdência suscita a questão: vale a pena implementar as mudanças propostas?<\/li>\n<\/ul><\/li>\n<li>&ldquo;a taxa de natalidade diminuiu bastante, esse é um dos motivos da reforma da previdência.&rdquo;<ul>\n<li><span class=c>C1:<\/span> Há erro de pontuação (vírgula inadequada) e de concordância ao unir duas orações independentes sem a devida conjunção ou pontuação correta. A frase deveria ser dividida ou conectada por conjunção, e o pronome demonstrativo deve concordar com o substantivo.<br><i>Sugestão:<\/i> A taxa de natalidade diminuiu bastante; esse é um dos motivos da reforma da previdência.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Mesmo tendo, aparentemente, boas intenções para essa reforma e acabando com privilégios, que pelas regras propostas, quem ganha mais deve contribuir mais com o sistema de aposentadorias.&rdquo;<ul>\n<li><span class=c>C4:<\/span> A sequência de orações está confusa e falta um conectivo que relacione claramente a ideia de &quot;boas intenções&quot; à de &quot;acabar com privilégios&quot;. Além disso, a referência &quot;que pelas regras propostas&quot; não está bem ancorada, gerando ruptura na coesão textual.<br><i>Sugestão:<\/i> Mesmo tendo, aparentemente, boas intenções, a reforma pretende acabar com privilégios, pois, segundo as regras propostas, quem ganha mais deve contribuir mais com o sistema de aposentadorias.<\/li>\n<\/ul><\/li>\n<li>&ldquo;há um grande porém que não podemos descartar.&rdquo;<ul>\n<li><span class=c>C3:<\/span> A ideia de contraste está presente, mas a organização das informações é fraca: o argumento aparece isolado, sem conexão lógica com o parágrafo anterior e posterior, o que impede a construção de uma sequência coerente de ideias.<br><i>Sugestão:<\/i> No entanto, há um ponto crítico que não podemos ignorar: a nova idade mínima de aposentadoria (65 anos) está muito próxima da expectativa de vida de grande parte da população.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Isso tudo é um grande problema se pararmos para pensar.&rdquo;<ul>\n<li><span class=c>C2:<\/span> A conclusão do parágrafo é vaga e genérica, não oferece argumentação concreta nem reforça a tese; demonstra falta de aprofundamento crítico exigido para o nível superior.<br><i>Sugestão:<\/i> Essas restrições podem agravar a vulnerabilidade dos idosos, configurando um problema estrutural que compromete a justiça social.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Acredito que pode‑se melhorar sem prejudicar os trabalhadores que se esforçam tanto para se manter.&rdquo;<ul>\n<li><span class=c>C4:<\/span> O pronome indefinido &quot;pode‑se&quot; não está bem conectado ao parágrafo anterior, criando uma quebra na articulação entre as ideias. Falta um conectivo que indique a relação de consequência ou sugestão em relação ao que foi exposto antes.<br><i>Sugestão:<\/i> Diante desses desafios, acredito que pode‑se melhorar a reforma sem prejudicar os trabalhadores que se esforçam tanto para se manter.<\/li>\n<li><span class=c>C5:<\/span> A frase apresenta uma proposta muito genérica, sem indicar quem executará a ação, qual será o procedimento concreto, nem o efeito esperado; falta detalhamento e clareza exigidos pela competência C5.<br><i>Sugestão:<\/i> O Congresso Nacional, em parceria com o Ministério da Economia, deve criar um comitê técnico para revisar as alíquotas contributivas, garantindo que trabalhadores de baixa renda tenham contribuição reduzida e que o benefício mínimo seja preservado, de modo a melhorar a previdência sem prejudicar quem já enfrenta dificuldades.<\/li>\n<\/ul><\/li>\n<li>&ldquo;cortar gastos desnecessário&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de concordância nominal: o adjetivo &quot;desnecessário&quot; deve concordar em gênero e número com o substantivo &quot;gastos&quot;, que está no plural.<br><i>Sugestão:<\/i> cortar gastos desnecessários<\/li>\n<\/ul><\/li>\n<li>&ldquo;cortar gastos desnecessário, diminuir salários muito altos (como de deputados, veradores etc.), cobrar dívidas previdenciárias de grandes empresas e impedir a desvinculação de receitas destinadas a programas sociais e previdenciários.&rdquo;<ul>\n<li><span class=c>C5:<\/span> A proposta não especifica quem será o agente responsável pela ação, nem descreve claramente o modo/meio de execução, o efeito esperado e o detalhamento necessário para torná‑la viável e respeitosa dos direitos humanos.<br><i>Sugestão:<\/i> O governo federal, por meio do Ministério da Fazenda, deve cortar gastos desnecessários, reduzir os salários de parlamentares e servidores públicos acima de 30 salários mínimos, cobrar dívidas previdenciárias de grandes empresas mediante auditorias trimestrais e impedir a desvinculação de receitas destinadas a programas sociais e previdenciários; assim, garantirá a sustentabilidade do sistema sem comprometer o direito à aposentadoria digna.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Como podemos ver, muito pode‑se fazer sem prejudicar os trabalhadores.&rdquo;<ul>\n<li><span class=c>C3:<\/span> O trecho encerra a argumentação de forma genérica e não retoma os argumentos desenvolvidos ao longo do texto, faltando uma síntese que una as informações e fatos apresentados, requisito essencial para a competência C3.<br><i>Sugestão:<\/i> Portanto, ao analisar os impactos da reforma, concluímos que é possível adotar medidas como a redução de gastos supérfluos e a cobrança de dívidas previdenciárias sem comprometer a aposentadoria dos trabalhadores.<\/li>\n<\/ul><\/li>\n<\/ol><h3>Como melhorar<\/h3><ul>\n<li><span class=c>C1:<\/span> Revisar a concordância verbal e nominal em todas as frases, prestando atenção ao número e gênero dos substantivos.<\/li>\n<li><span class=c>C1:<\/span> Ajustar a pontuação, especialmente o uso de vírgulas e ponto‑e‑vírgula, para separar orações independentes e evitar períodos confusos.<\/li>\n<li><span class=c>C1:<\/span> Utilizar um registro formal consistente, evitando expressões coloquiais e garantindo que o vocabulário esteja adequado ao gênero dissertativo‑argumentativo.<\/li>\n<li><span class=c>C2:<\/span> Desenvolver argumentos com maior profundidade, apresentando dados ou exemplos específicos que sustentem cada ponto de vista.<\/li>\n<li><span class=c>C2:<\/span> Organizar o texto em blocos claros de tese, argumentos e contra-argumentos, garantindo transições lógicas entre eles.<\/li>\n<li><span class=c>C2:<\/span> Concluir de forma assertiva, retomando a tese e sintetizando os principais argumentos, evitando frases genéricas ou vagas.<\/li>\n<li><span class=c>C3:<\/span> Estruture o texto em blocos claros: introdução (apresentação do tema e tese), desenvolvimento (argumentos com fatos e dados organizados em parágrafos distintos) e conclusão (síntese e proposta de solução).<\/li>\n<li><span class=c>C3:<\/span> Utilize conectivos de forma explícita (por exemplo, &quot;além disso&quot;, &quot;por outro lado&quot;, &quot;consequentemente&quot;) para garantir a coesão entre os argumentos e facilitar a defesa do ponto de vista.<\/li>\n<li><span class=c>C3:<\/span> Reforce a autoria ao inserir sua análise crítica ao final de cada argumento, mostrando como os fatos apresentados sustentam sua posição sobre a reforma.<\/li>\n<li><span class=c>C4:<\/span> Utilize conectivos de consequência, adição ou contraste (por exemplo, &quot;portanto&quot;, &quot;além disso&quot;, &quot;por outro lado&quot;) para ligar explicitamente os parágrafos e as ideias dentro dos parágrafos.<\/li>\n<li><span class=c>C4:<\/span> Revise as referências pronominais e verbais, garantindo que cada pronome ou forma impessoal tenha um antecedente claro e esteja inserido em uma estrutura coesa.<\/li>\n<li><span class=c>C4:<\/span> Varie os recursos de coesão (conjunções, advérbios, pronomes demonstrativos) de forma equilibrada, evitando repetições e reforçando a progressão lógica do texto.<\/li>\n<li><span class=c>C5:<\/span> Defina claramente o agente da intervenção (ex.: governo federal, Congresso, Ministério da Economia) e descreva seu papel específico.<\/li>\n<li><span class=c>C5:<\/span> Especifique o modo/meio de execução da ação (ex.: criação de comitê técnico, auditorias trimestrais, legislação específica) e indique o efeito esperado (ex.: sustentabilidade do fundo, manutenção do direito à aposentadoria digna).<\/li>\n<li><span class=c>C5:<\/span> Detalhe os passos da proposta, incluindo prazos, recursos necessários e como a medida respeita os direitos humanos, evitando impactos negativos sobre grupos vulneráveis.<\/li>\n<\/ul>"}, {"cod": "F07", "tema": "Um réu deve ou não ser preso após a condenação em 2ª. instância?", "titulo": "A inconstitucionalidade da prisão após o julgamento em segunda instância", "motivadores": "<p>No início deste mês de novembro, o Supremo Tribunal Federal deve decidir sobre a prisão em 2ª. instância, isto é, se os réus de processo criminal continuarão a ser presos - como têm sido até agora - após a sentença de dois níveis da Justiça: aquela determinada pelo juiz único do primeiro julgamento e mantida pelos desembargadores do Tribunal de Justiça, um órgão superior que julga os recursos contra essa determinação. Se houver um novo entendimento do STF, a prisão só poderá ocorrer depois do esgotamento das possibilidades de recurso no Superior Tribunal de Justiça e, a seguir, no próprio Supremo, que funcionariam como 3ª. e 4ª. instâncias. Sem levar em consideração a decisão final (que não foi emitida até a publicação desta proposta), entenda melhor a questão lendo os textos da coletânea e redija uma dissertação argumentativa expondo a sua opinião sobre o tema: o réu deve poder recorrer às últimas instâncias em liberdade ou na prisão? Ou seja: a prisão de um réu condenado por um juiz e por desembargadores deve ser imediata ou só pode acontecer depois de esgotados todos os recursos nas cortes superiores?<\/p><p>As legislações dos países que influenciaram o sistema criminal brasileiro permitem as prisões de réus após condenações em segunda instância. Além disso, tratados internacionais sobre direitos humanos determinam que decisões de dois níveis da Justiça já são suficientes para assegurar o direito de defesa dos acusados, segundo especialistas ouvidos pela Folha.<\/p><p>A orientação em vigor atualmente (15/10/19) no Brasil está alinhada com a das nações que inspiraram nossas leis penais, uma vez que aqui as detenções também podem ser feitas depois das sentenças de segunda instância.<\/p><p>Folha de S. Paulo (editado)<\/p><p>O Supremo Tribunal Federal, porém, pode mudar esse posicionamento em discussão que será retomada em novembro. A corte pode determinar que os encarceramentos só ocorram após o esgotamento das possibilidades de recursos ao STJ (Superior Tribunal de Justiça) e ao próprio Supremo. Em um julgamento, o STF examinou a regra constitucional que determina que &quot;ninguém será considerado culpado até o trânsito em julgado de sentença penal condenatória&quot;. Na ocasião, para a maioria dos ministros do tribunal ocorreria uma violação ao direito de ampla defesa, caso as prisões de condenados pudessem ocorrer antes do esgotamento da possibilidade de recorrer ao STJ e STF, sob a ótica do texto da Constituição Federal.<\/p><p>Folha de São Paulo (editado)<\/p><p>Luiza Cristina Frischeisen, do MPF (Ministério Público Federal), considera que &quot;se o STF decidir que a prisão ocorra somente após o trânsito em julgado (esgotados todos os recursos), o Brasil ficará extremamente isolado, em matéria penal, entre outros países democráticos. Uma decisão nesse sentido favorece a impunidade&quot;, pois há um &quot;excessivo número de recursos no direito penal brasileiro&quot;.<\/p><p>UOL Notícias (Editado)<\/p><p>Alemanha: Nenhum tipo de recurso aos tribunais superiores sobre decisões de primeiro grau permite a liberdade provisória. Ou seja, enquanto recorre, o réu aguarda preso.<\/p><p>Argentina: A execução da pena é imediata, após a sentença de primeiro grau. Não é preciso aguardar o trânsito em julgado. Há exceções para grávidas ou mães com bebês menores de seis meses de idade.<\/p><p>Estados Unidos: A prisão ocorre após a sentença de primeiro grau. É permitida a suspensão da pena ou que o preso aguarde o julgamento em liberdade, mediante o pagamento de fiança, em casos específicos.<\/p><p>França: Os condenados em primeiro grau aguardam em liberdade o julgamento dos recursos.<\/p><p>Portugal: Os réus condenados em primeiro grau aguardam em liberdade, enquanto não se esgotarem os recursos.<\/p><p>UOL Notícias (Editado)<\/p>", "paragrafos": ["É notório que a prisão após o julgamento em segunda instância traz divergências de opiniões, principalmente em relação a compatibilidade ou incompatibilidade com o ordenamento jurídico e com a Constituição. Dentre tantos fatores relevantes para essa discussão temos os aspectos favoráveis e contrários a esse ato muitas vezes inconstitucional.", "Sabe-se que a maioria dos aspectos favoráveis ao cumprimento da pena em segunda instância referem-se a refere-se à palavra impunidade. Essas pessoas dizem que os mais ricos jamais seriam presos, pois possuem todos os recursos e os melhores advogados para procrastinar ao máximo suas penas. Alegam que outros criminosos seriam igualmente beneficiados ante a demora na tramitação dos processos na justiça brasileira; tudo isso contribuiria ainda mais para o aumento do crime.", "Por outro lado, os que são contrários a prisão antes do trânsito em julgado fundamentam suas posições no texto da própria Constituição, no qual está escrito que ninguém pode ser considerado culpado senão após o trânsito em julgado da sentença penal condenatória que só ocorre no momento em que se esgotam todos os recursos. Essas pessoas também entendem que a Legislação Penal já criou medidas para inibir o crime e proteger a sociedade de perfis altamente perigoso perigosos, como a prisão preventiva e temporária.", "Por tudo isso, faz-se necessário que o poder judiciário Judiciário cumpra o seu papel institucional e julgue a questão com a maior brevidade possível. Não obstante, o Parlamento deve discutir sobre todo o sistema recursal penal brasileiro e a sua manutenção, enquanto isso, o Supremo Tribunal Federal manter deve manter o acesso aos recurso previsto recursos previstos em lei."], "sistema": {"C1": 160, "C2": 160, "C3": 160, "C4": 160, "C5": 160}, "feedback": "<h3>Pontos fortes<\/h3><ul>\n<li><span class=c>C1:<\/span> Boa organização das ideias e uso adequado de conectivos que garantem coesão textual.<\/li>\n<li><span class=c>C1:<\/span> Vocabulário adequado ao tema, demonstrando domínio de registro formal.<\/li>\n<li><span class=c>C2:<\/span> Apresenta uma proposta de intervenção clara, indicando a necessidade de rapidez no julgamento e a discussão legislativa sobre o sistema recursal.<\/li>\n<li><span class=c>C2:<\/span> Constrói argumentos favoráveis e contrários ao tema, demonstrando compreensão da controvérsia e mantendo a estrutura dissertativo‑argumentativa.<\/li>\n<li><span class=c>C3:<\/span> Apresentou informações e fatos relevantes ao tema, demonstrando conhecimento da controvérsia sobre a prisão após segunda instância.<\/li>\n<li><span class=c>C3:<\/span> Defendeu um ponto de vista ao relacionar a necessidade de rapidez no julgamento com a proteção da sociedade.<\/li>\n<li><span class=c>C4:<\/span> Você utiliza conectivos como &quot;por outro lado&quot; e &quot;por tudo isso&quot; para marcar a oposição e a conclusão, o que ajuda a organizar o texto.<\/li>\n<li><span class=c>C4:<\/span> Há variedade de recursos de referência (por exemplo, &quot;essas pessoas&quot;, &quot;o poder judiciário&quot;) que demonstra domínio básico da coesão referencial.<\/li>\n<li><span class=c>C5:<\/span> Você articulou bem os argumentos favoráveis e contrários à prisão após a segunda instância, demonstrando compreensão do tema e dos princípios constitucionais.<\/li>\n<li><span class=c>C5:<\/span> A redação apresenta uma estrutura coerente, com introdução, desenvolvimento e conclusão, facilitando a leitura e o acompanhamento da sua linha de raciocínio.<\/li>\n<\/ul><h3>O que corrigir, trecho a trecho<\/h3><ol>\n<li>&ldquo;referem-se a refere-se à palavra impunidade.&rdquo;<ul>\n<li><span class=c>C1:<\/span> Repetição desnecessária do verbo e falta de concordância; o verbo deve aparecer apenas uma vez e concordar com o sujeito &quot;aspectos&quot;.<br><i>Sugestão:<\/i> referem‑se à palavra impunidade.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Essas pessoas dizem que os mais ricos jamais seriam presos, pois possuem todos os recursos e os melhores advogados para procrastinar ao máximo suas penas.&rdquo;<ul>\n<li><span class=c>C3:<\/span> O trecho apresenta uma generalização sem fundamentação e não traz dados ou argumentos que sustentem a afirmação, o que enfraquece a consistência da defesa do ponto de vista.<br><i>Sugestão:<\/i> Essas pessoas argumentam que, devido ao maior acesso a recursos financeiros e a advogados experientes, indivíduos mais abastados tendem a obter prazos mais longos para a execução da pena, o que pode gerar sensação de impunidade.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Essas pessoas também entendem que a Legislação Penal já criou medidas para inibir o crime e proteger a sociedade de perfis altamente perigoso perigosos, como a prisão preventiva e temporária.&rdquo;<ul>\n<li><span class=c>C4:<\/span> O trecho apresenta repetição desnecessária de termos (&quot;perigoso perigosos&quot;) e falta de conexão clara com a ideia anterior, o que rompe a fluidez entre os parágrafos. Além disso, o uso de &quot;também&quot; não está bem ancorado a um elemento de referência que o justifique, enfraquecendo a coesão textual.<br><i>Sugestão:<\/i> Essas pessoas também entendem que a Legislação Penal já criou medidas para inibir o crime e proteger a sociedade de perfis altamente perigosos, como a prisão preventiva e temporária.<\/li>\n<\/ul><\/li>\n<li>&ldquo;o poder judiciário Judiciário cumpra o seu papel institucional&rdquo;<ul>\n<li><span class=c>C1:<\/span> Redundância e erro de capitalização; a palavra &quot;Judiciário&quot; aparece duas vezes e a segunda está em maiúscula sem necessidade.<br><i>Sugestão:<\/i> o poder judiciário cumpra o seu papel institucional<\/li>\n<\/ul><\/li>\n<li>&ldquo;o Supremo Tribunal Federal manter deve manter o acesso aos recurso previsto recursos previstos em lei.&rdquo;<ul>\n<li><span class=c>C1:<\/span> Problema de regência, concordância e repetição; o verbo &quot;manter&quot; está duplicado e há discordância entre &quot;acesso&quot; (singular) e &quot;recursos&quot; (plural).<br><i>Sugestão:<\/i> o Supremo Tribunal Federal deve manter o acesso aos recursos previstos em lei.<\/li>\n<li><span class=c>C2:<\/span> O trecho demonstra falta de coesão e clareza na apresentação da ideia, o que impede que a argumentação seja desenvolvida de forma consistente e produtiva. A repetição de palavras e a construção confusa prejudicam a fluidez do texto e enfraquecem o repertório sociocultural exigido para alcançar a nota máxima.<br><i>Sugestão:<\/i> O Supremo Tribunal Federal deve garantir o acesso aos recursos previstos em lei.<\/li>\n<li><span class=c>C5:<\/span> A proposta de intervenção não especifica claramente quem age (agente), qual ação será tomada, como será feita (modo/meio), qual efeito se espera e não detalha o procedimento. Na competência C5 é imprescindível apresentar esses elementos de forma explícita e organizada.<br><i>Sugestão:<\/i> O Supremo Tribunal Federal deve garantir o acesso aos recursos previstos em lei, instituindo um procedimento simplificado de recurso que permita ao réu recorrer em até 48 horas, com acompanhamento de defensoria pública, a fim de evitar prisões desnecessárias e assegurar o direito ao devido processo legal.<\/li>\n<\/ul><\/li>\n<li>&ldquo;A redacao ja foi corrigida e tirou 160 de 200 em C3.&rdquo;<ul>\n<li><span class=c>C3:<\/span> A frase não contribui para a construção do argumento sobre o tema; funciona como comentário metatextual que interrompe a coesão e a progressão lógica do texto.<br><i>Sugestão:<\/i> A pontuação da pena em segunda instância tem gerado intenso debate entre juristas e legisladores.<\/li>\n<\/ul><\/li>\n<\/ol><h3>Como melhorar<\/h3><ul>\n<li><span class=c>C1:<\/span> Revise a concordância verbal e nominal, evitando repetições e garantindo que sujeito e verbo estejam em harmonia.<\/li>\n<li><span class=c>C1:<\/span> Preste atenção à regência dos verbos e à concordância de número entre substantivos e seus complementos.<\/li>\n<li><span class=c>C1:<\/span> Faça uma leitura final focada na pontuação e na ortografia, corrigindo erros de capitalização e de grafia que possam comprometer a formalidade do texto.<\/li>\n<li><span class=c>C2:<\/span> Enriqueça a argumentação com referências a fatos, decisões judiciais ou dados históricos que demonstrem o impacto da prisão após segunda instância no sistema penal brasileiro.<\/li>\n<li><span class=c>C2:<\/span> Reforce a coesão textual, evitando repetições e construções confusas; use conectivos adequados para ligar ideias e garantir clareza.<\/li>\n<li><span class=c>C2:<\/span> Aprofunde a proposta de intervenção, especificando responsáveis, ações concretas e prazos, mostrando viabilidade e respeito aos direitos fundamentais.<\/li>\n<li><span class=c>C3:<\/span> Fundamente cada afirmação com argumentos claros e, quando possível, com referências a dispositivos legais ou decisões judiciais, evitando generalizações vagas.<\/li>\n<li><span class=c>C3:<\/span> Mantenha a coesão textual, eliminando comentários externos ao tema e garantindo que todos os parágrafos contribuam diretamente para a defesa do seu ponto de vista.<\/li>\n<li><span class=c>C3:<\/span> Organize melhor as ideias, usando conectivos que indiquem causa, consequência e contraste, de modo a tornar a sequência argumentativa mais fluida e persuasiva.<\/li>\n<li><span class=c>C4:<\/span> Varie os conectivos, alternando entre &quot;além disso&quot;, &quot;consequentemente&quot;, &quot;por conseguinte&quot; etc., para evitar repetições e tornar a articulação entre períodos mais fluida.<\/li>\n<li><span class=c>C4:<\/span> Use pronomes ou expressões de referência de forma precisa, garantindo que cada elemento referencial tenha um antecedente claro e único.<\/li>\n<li><span class=c>C4:<\/span> Revise a estrutura dos parágrafos para que cada um contenha uma ideia central bem delimitada e seja introduzido por um conectivo que indique sua relação com o parágrafo anterior.<\/li>\n<li><span class=c>C5:<\/span> Defina claramente o agente, a ação, o modo/meio, o efeito e o detalhamento da sua proposta de intervenção, seguindo o esquema: quem fará, o que fará, como fará, qual será o resultado e como será implementado.<\/li>\n<li><span class=c>C5:<\/span> Utilize verbos no infinitivo ou no futuro do presente para indicar a ação proposta e inclua informações concretas sobre procedimentos, prazos ou responsáveis, sem recorrer a dados inexistentes.<\/li>\n<li><span class=c>C5:<\/span> Conecte a proposta ao desenvolvimento do texto, retomando os argumentos apresentados e mostrando como a intervenção resolve os problemas apontados na discussão.<\/li>\n<\/ul>"}, {"cod": "F08", "tema": "Por que valorizar o patrimônio histórico?", "titulo": "um pais sem memória.", "motivadores": "<p>Em seu significado mais primitivo, a palavra patrimônio tem origem atrelada ao termo grego pater, que significa “pai” ou “paterno”. De tal forma, patrimônio veio a se relacionar com tudo aquilo que é deixado pela figura do pai e transmitido para seus filhos. Com o passar do tempo, essa noção de repasse acabou sendo estendida a um conjunto de bens materiais que estão intimamente relacionados com a identidade, a cultura ou o passado de uma coletividade.\nEssa última noção de patrimônio passou a ganhar força no século XIX, logo que a Revolução Francesa salientou a necessidade de eleger monumentos que pudessem refutar o esquecimento do passado. Nesse período, levando-se em conta as noções historiográficas da época, os monumentos deveriam expressar os fatos de natureza singular e grandiosa. Sendo assim, a preservação do passado colocava-se presa a uma noção de “melhoria”, “evolução” e “progresso”. [Brasil Escola] Leia o texto na íntegra\nDois de setembro, domingo. Por volta das 19h, as chamas começaram a tomar conta do Museu Nacional, na Quinta da Boa Vista, no Rio de Janeiro. Só às 2h de segunda-feira o incêndio de grandes proporções foi controlado. Cerca de 90% do que havia no interior da instituição — 20 milhões de itens, entre fósseis, múmias e registros históricos — além do local que serviu de residência para a Família Real no século XIX, foram destruídos. [O Globo] Leia o texto na íntegra\nPreservar os espaços antigos, como é o caso do Palácio da Quinta da Boa Vista, significa dar a eles manutenção adequada e modernizar suas estruturas. Como afirma Jussara: “É necessário que haja uma política de proteção a esses prédios (do patrimônio histórico) de maneira geral e, especificamente, dos museus. Porque são prédios vulneráveis pela própria constituição e que contêm material altamente suscetível a ser consumido em um incêndio”. Talvez isso custe caro. Mas cultura e ciência não foram feitas para gerar riqueza financeira à priori. Entretanto, a falta de investimento em ambas pode, isso sim, gerar não só pobreza intelectual como também financeira.[Estadão] Leia o texto na íntegra\n<\/p>", "paragrafos": ["É indiscutível a importância da conservação e do cuidado com o patrimônio histórico do país. Dentre tantos fatores relevantes, destacam-se: a proteção dos acervos, investimentos continuo para a manutençao estruturais e materiais e pessoas qualificadas para administrar.", "Sabe-se que, para manter estes cuidados com essas valiosas estruturas históricas pelo país, requer investimentos financeiros, como também a manutenção permanente do material exposto. Seguramente essa atenção não ocorreu, como foi presenciado no estado do Rio de Janeiro, no mês de setembro, o Museu Nacional do Brasil passava por grandes dificuldades não só financeira mas também administrativa, onde houve omissão por parte das autoridades competentes, quanto ao zelo e fiscalização do Museu.", "Ainda convém lembrar, que é incalculável para o Brasil a perda do acervo do Museu Nacional. Foram duzentos anos de história destruída. Ali estava um dos maiores acervos de antropologia e história natural do país, eram cerca de vinte milhões, o qual eram uma herança de conhecimento e estudos acessível para todos. Porque um país que não protege a sua história e não deixa como legado para as futuras gerações o compromisso que se deve ter com essas riquezas é uma nação sem memória.", "Como se vê , para a conservação e proteção do patrimônio histórico, é essencial ter investimentos financeiros, tanto dos setores públicos como também dos privados, não esquecendo que a administração deve ser eficiente, com pessoas capacitadas e com conhecimentos nessa área. Desse modo, poderão ser evitados perdas irreparáveis como o ocorrido no, Rio de Janeiro, a história de um país é muito importante para a população e é uma obrigação a sua preservação."], "sistema": {"C1": 120, "C2": 120, "C3": 120, "C4": 120, "C5": 120}, "feedback": "<h3>Pontos fortes<\/h3><ul>\n<li><span class=c>C1:<\/span> Você demonstra boa compreensão do tema, apresentando argumentos relevantes sobre a importância da conservação do patrimônio histórico.<\/li>\n<li><span class=c>C1:<\/span> A estrutura geral do texto (introdução, desenvolvimento e conclusão) está presente, o que facilita a leitura.<\/li>\n<li><span class=c>C2:<\/span> Você demonstra compreensão da proposta ao abordar diretamente a importância da valorização do patrimônio histórico e ao citar um exemplo concreto (o incêndio no Museu Nacional).<\/li>\n<li><span class=c>C2:<\/span> A estrutura básica de introdução, desenvolvimento e conclusão está presente, o que impede que a nota seja inferior.<\/li>\n<li><span class=c>C3:<\/span> Apresenta dados concretos sobre o incêndio no Museu Nacional, demonstrando conhecimento de fatos relevantes ao tema.<\/li>\n<li><span class=c>C3:<\/span> Defende claramente a necessidade de investimento público e privado na preservação do patrimônio histórico.<\/li>\n<li><span class=c>C4:<\/span> Você utilizou conectivos que indicam causa e consequência, como &quot;por isso&quot; e &quot;como se vê&quot;, o que demonstra alguma preocupação em ligar as ideias.<\/li>\n<li><span class=c>C4:<\/span> Há tentativa de retomar o tema ao longo do texto, mantendo o foco na importância da preservação do patrimônio histórico.<\/li>\n<li><span class=c>C5:<\/span> Você reconheceu a necessidade de investimentos públicos e privados e destacou a importância de uma administração capacitada, o que demonstra compreensão do problema central.<\/li>\n<\/ul><h3>O que corrigir, trecho a trecho<\/h3><ol>\n<li>&ldquo;investimentos continuo para a manutençao estruturais e materiais&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de ortografia (continuo → contínuo), concordância nominal (manutençao → manutenção) e de regência (estruturais e materiais não concordam com o substantivo antecedente).<br><i>Sugestão:<\/i> investimentos contínuos para a manutenção estrutural e material<\/li>\n<\/ul><\/li>\n<li>&ldquo;Sabe-se que, para manter estes cuidados com essas valiosas estruturas históricas pelo país, requer investimentos financeiros, como também a manutenção permanente do material exposto.&rdquo;<ul>\n<li><span class=c>C3:<\/span> O trecho apresenta ideias desconexas e repete informações já citadas, o que compromete a coesão e a progressão lógica dos argumentos. Falta uma sequência clara que una a necessidade de investimento à consequência da falta dele.<br><i>Sugestão:<\/i> Para garantir a conservação dessas valiosas estruturas históricas, é imprescindível investir financeiramente e assegurar a manutenção permanente dos materiais expostos.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Seguramente essa atenção não ocorreu, como foi presenciado no estado do Rio de Janeiro, no mês de setembro, o Museu Nacional do Brasil passava por grandes dificuldades não só financeira mas também administrativa, onde houve omissão por parte das autoridades competentes, quanto ao zelo e fiscalização do Museu.&rdquo;<ul>\n<li><span class=c>C4:<\/span> A sequência de ideias está confusa porque há falta de conectores claros que indiquem a relação temporal e de causa‑efeito entre a falta de atenção e as dificuldades do museu. Além disso, a oração &quot;como foi presenciado...&quot; está inserida de forma abrupta, rompendo a coesão entre os períodos.<br><i>Sugestão:<\/i> Seguramente essa atenção não ocorreu; como se viu no estado do Rio de Janeiro, em setembro, o Museu Nacional do Brasil enfrentava grandes dificuldades, tanto financeiras quanto administrativas, devido à omissão das autoridades competentes na fiscalização do patrimônio.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Ainda convém lembrar, que é incalculável para o Brasil a perda do acervo do Museu Nacional.&rdquo;<ul>\n<li><span class=c>C2:<\/span> O argumento é apresentado de forma genérica e não demonstra conexão clara com a tese de valorização do patrimônio. É preciso explicitar como essa perda evidencia a necessidade de valorização e quais consequências concretas isso gera para a sociedade.<br><i>Sugestão:<\/i> Ainda convém lembrar que a perda do acervo do Museu Nacional é incalculável para o Brasil, pois elimina fontes essenciais de pesquisa, educação e identidade cultural, evidenciando a urgência de valorizar e proteger o patrimônio histórico.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Ali estava um dos maiores acervos de antropologia e história natural do país, eram cerca de vinte milhões, o qual eram uma herança de conhecimento e estudos acessível para todos.&rdquo;<ul>\n<li><span class=c>C4:<\/span> O pronome &quot;o qual&quot; não retoma adequadamente o antecedente &quot;acervos&quot; (plural) e a mudança abrupta de número gera ruptura coesiva. Falta um conectivo que una as duas informações sobre a quantidade e a importância do acervo.<br><i>Sugestão:<\/i> Ali estava um dos maiores acervos de antropologia e história natural do país, com cerca de vinte milhões de itens, os quais constituem uma herança de conhecimento e estudos acessível a todos.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Porque um país que não protege a sua história e não deixa como legado para as futuras gerações o compromisso que se deve ter com essas riquezas é uma nação sem memória.&rdquo;<ul>\n<li><span class=c>C1:<\/span> Frase inicia com conjunção coordenativa “Porque”, que não deve ser usada para iniciar período em texto formal; há falta de pontuação que prejudica a clareza; o verbo “deixa” está em concordância inadequada com o sujeito “país”.<br><i>Sugestão:<\/i> Um país que não protege a sua história e não deixa como legado às futuras gerações o compromisso que se deve ter com essas riquezas é uma nação sem memória.<\/li>\n<li><span class=c>C3:<\/span> A construção da frase é confusa e não estabelece uma relação de causa‑efeito bem definida, dificultando a defesa do ponto de vista. Além disso, a argumentação fica vaga, sem aprofundar o impacto da perda da memória histórica.<br><i>Sugestão:<\/i> Um país que não protege sua história nem a transmite às futuras gerações perde a memória coletiva, tornando‑se uma nação sem identidade.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Como se vê , para a conservação e proteção do patrimônio histórico, é essencial ter investimentos financeiros, tanto dos setores públicos como também dos privados, não esquecendo que a administração deve ser eficiente, com pessoas capacitadas e com conhecimentos nessa área.&rdquo;<ul>\n<li><span class=c>C2:<\/span> A argumentação se limita a repetir a ideia de investimento sem aprofundar a relação entre esses recursos e a efetiva valorização do patrimônio. Falta desenvolvimento de argumentos consistentes, como a necessidade de políticas públicas, educação patrimonial ou parcerias estratégicas, que mostrariam um raciocínio mais elaborado e coerente.<br><i>Sugestão:<\/i> Como se vê, para a conservação e proteção do patrimônio histórico, é essencial garantir investimentos financeiros tanto do setor público quanto do privado, além de implementar políticas públicas de preservação, programas de educação patrimonial e parcerias estratégicas que assegurem a gestão eficiente por profissionais capacitados.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Desse modo, poderão ser evitados perdas irreparáveis como o ocorrido no, Rio de Janeiro, a história de um país é muito importante para a população e é uma obrigação a sua preservação.&rdquo;<ul>\n<li><span class=c>C3:<\/span> A sequência de ideias está desorganizada: há interrupção abrupta, falta de pontuação adequada e a conexão entre a prevenção de perdas e a importância da história não está bem articulada, prejudicando a organização textual exigida na competência C3.<br><i>Sugestão:<\/i> Desse modo, perdas irreparáveis como a ocorrida no Rio de Janeiro podem ser evitadas; a história de um país é fundamental para a população e sua preservação constitui uma obrigação.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Desse modo, poderão ser evitados perdas irreparáveis como o ocorrido no, Rio de Janeiro,&rdquo;<ul>\n<li><span class=c>C5:<\/span> A proposta de intervenção não apresenta os elementos exigidos pela competência C5: falta o agente responsável (ex.: governo federal, secretarias de cultura), a ação concreta (ex.: criação de fundo permanente), o modo/meio de execução (ex.: destinação de recursos orçamentários e auditoria independente) e o efeito esperado (ex.: redução de incidentes de incêndio e degradação). O trecho apenas indica que &quot;poderão ser evitados&quot; sem especificar quem fará o quê, como e com que resultado.<br><i>Sugestão:<\/i> Desse modo, o governo federal, por meio do Ministério da Cultura, deverá criar um Fundo Nacional de Preservação do Patrimônio Histórico, destinando recursos anuais e estabelecendo auditorias independentes para garantir a correta aplicação dos recursos, o que evitará perdas irreparáveis como a ocorrida no Rio de Janeiro.<\/li>\n<\/ul><\/li>\n<\/ol><h3>Como melhorar<\/h3><ul>\n<li><span class=c>C1:<\/span> Revisar ortografia e concordância antes de finalizar o texto, usando ferramentas de correção ou leitura em voz alta.<\/li>\n<li><span class=c>C1:<\/span> Atentar-se ao registro formal: evitar iniciar frases com conjunções como “porque” e garantir a pontuação adequada para separar ideias.<\/li>\n<li><span class=c>C1:<\/span> Praticar a escrita de frases curtas e bem estruturadas, verificando a regência verbal e nominal de cada verbo e substantivo.<\/li>\n<li><span class=c>C2:<\/span> Desenvolva cada argumento com exemplos, dados ou consequências concretas, mostrando a relação direta entre valorização e benefícios sociais, culturais e econômicos.<\/li>\n<li><span class=c>C2:<\/span> Organize o texto de forma mais coesa, conectando as ideias com conectivos adequados e evitando repetições superficiais de conceitos.<\/li>\n<li><span class=c>C2:<\/span> Apresente propostas específicas (ex.: criação de fundos de preservação, incentivos fiscais para empresas, programas escolares de educação patrimonial) que demonstrem uma argumentação consistente e aprofundada.<\/li>\n<li><span class=c>C3:<\/span> Planeje o texto antes de escrever, definindo uma estrutura clara: introdução com tese, desenvolvimento com dois ou três argumentos bem encadeados e conclusão que retome a tese.<\/li>\n<li><span class=c>C3:<\/span> Use conectivos lógicos (por exemplo, &quot;além disso&quot;, &quot;consequentemente&quot;, &quot;por isso&quot;) para garantir a coesão entre os parágrafos e dentro deles.<\/li>\n<li><span class=c>C3:<\/span> Enriqueça a argumentação com exemplos variados (dados, legislações, políticas públicas) e explique explicitamente como cada exemplo sustenta seu ponto de vista, demonstrando autoria e profundidade de análise.<\/li>\n<li><span class=c>C4:<\/span> Planeje a sequência lógica dos parágrafos antes de escrever, definindo quais conectivos (porém, portanto, consequentemente, etc.) vão ligar cada ideia.<\/li>\n<li><span class=c>C4:<\/span> Use pronomes de referência que concordem em número e gênero com seus antecedentes e evite inserções abruptas; prefira estruturas como &quot;como se viu&quot; ou &quot;conforme demonstrado&quot; para introduzir exemplos.<\/li>\n<li><span class=c>C4:<\/span> Varie os recursos coesivos: além de conectivos, explore elipses, substituições sinônimas e repetições controladas para reforçar a ligação entre frases e parágrafos.<\/li>\n<li><span class=c>C5:<\/span> Defina claramente o agente da proposta (ex.: governo federal, secretarias estaduais, iniciativa privada).<\/li>\n<li><span class=c>C5:<\/span> Especifique a ação concreta, o meio de execução e o efeito esperado, seguindo a estrutura agente‑ação‑modo‑efeito.<\/li>\n<li><span class=c>C5:<\/span> Integre a proposta ao desenvolvimento do texto, retomando argumentos apresentados nos parágrafos anteriores para garantir coesão e pertinência.<\/li>\n<\/ul>"}, {"cod": "F09", "tema": "O que podemos aprender com a prática esportiva?", "titulo": "Desporto magistério", "motivadores": "<p>&quot;O homem moderno vem deixando de lado as práticas esportivas, o que muitas vezes leva a um estilo de vida sedentário e provoca distúrbios como má alimentação, obesidade, tabagismo, estresse, doenças coronarianas etc. Como reação a essa atitude, a ciência do esporte vem desenvolvendo estudos e demonstrando a importância que a prática constante de uma atividade física bem planejada tem para que as pessoas possam ter uma vida mais saudável&quot;. [Brasil Escola - leia na íntegra]\n&quot;Todas as pessoas necessitam de atividades para o desenvolvimento. Mas, na fase da infância, é quase essencial praticar exercícios. &quot;Os esportes podem ajudar na coordenação, evitar lesões e ainda colaborar no aspecto social durante esta fase&quot;, explicou o preparador físico Aulus Sellmer. [Estadão - Leia e ouça na íntegra]\n&quot;A UNESCO sempre trabalhou o esporte e a educação física como instrumentos importantes para a formação de valores, a socialização e o desenvolvimento humano. Uma vez que o ato constitutivo da UNESCO (1945)1 nos lembra de que “se a guerra nasce na mente dos homens, é na mente dos homens que devem ser construídas as defesas da paz”, não existe melhor ferramenta para promover o diálogo e a cooperação do que o esporte. A prática esportiva reforça valores positivos, como o jogo limpo (fairplay), o companheirismo e o espírito de equipe&quot;.[UNESCO - Leia na íntegra]\n&quot;Ygor Coelho de Oliveira sabe que as medalhas olímpicas estão praticamente fora de seu alcance, mas abre um largo sorriso por já ter conquistado uma grande vitória: participar dos Jogos Olímpicos de 2016, no Rio de Janeiro. Ele é o primeiro atleta brasileiro da história a conseguir classificação para o torneio olímpico de badminton, um fato que adquire a magnitude de uma grande proeza ao levar em conta que ele aprendeu a jogar o esporte quase desconhecido no país em uma favela&quot;. [Portal ESPN - leia na íntegra]\nCONTRAPONTO: \n&quot;O importante não é vencer, mas participar.&quot; O lema apareceu pela primeira vez durante os Jogos Olímpicos de 1908, em Londres. Desde então, encaramos o esporte como uma prática sem perdedores. Aos vencedores, os louros da vitória. Aos derrotados, o aprendizado lições como disciplina, determinação, espírito de equipe. Daí a missão das Olimpíadas: &quot;Um mundo mais pacífico e melhor por meio do esporte&quot; (com a qual o Rio foi encarregado de colaborar em 2016). A tese soa inspiradora, mas nem pra todo mundo. [Revista Superinteressante - leia na íntegra]\n<\/p>", "paragrafos": ["Extremamente conhecido ao redor do mundo, o desenho japonês Super Campeões teve a missão de mostrar para as crianças a importância de praticar esportes. Na trama, o futebol representa o vetor que é capaz de ensinar valores como, por exemplo, o trabalho em equipe, a interação social e a amizade. Se no anime o futebol foi tão importante para transmitir ideais, na vida real não seria diferente. Assim, surge a questão: o que podemos aprender com a prática esportiva?", "Historicamente, o esporte se fez necessário. Os jogos olímpicos surgiram, na Grécia antiga, com o propósito de apaziguar guerras. Com isso, o mundo viu o primeiro grande ensinamento dos esportes: o legado da paz. Séculos depois do fim da antiguidade grega, o esporte continua sendo um excelente professor para o homem, mostrando, a este, que os esforços esportivos diminuem riscos de doenças para os praticantes. Ao contrário dos esportistas, os sedentários são seis vezes mais propensos a desenvolverem problemas cardíacos, ósseos e musculares, afirma a Organização Mundial da Saúde.", "Além disso, o esporte promove não apenas a inclusão social das pessoas portadoras de deficiência, mas também a ascensão social de jovens oriundos de comunidades pobres. Exemplos de transformação puderam ser vistos nas olímpiadas Rio 2016, quando vários atletas de origem humildes subiram no pódio. Para as competições físicas, todos são iguais. Não existem negros ou branco, pobres ou ricos. Apenas atletas.", "Fica clara, portanto, a necessidade de incentivar o desporto. Cabe ao Governo Federal promover, junto com o Ministério do Esporte, a construção de parques e praças esportivas comunitárias. O Ministério da Educação, por sua vez, deve ampliar o calendário esportivo das escolas, conscientizando, na prática, a importância física e intelectual de ser um esportista. Ainda nesse sentido, Colégios e universidades devem ministrar palestras sobre o assunto. As ONGs e prefeituras devem investir recursos nas comunidades carentes, proporcionando caminhos para que os jovens se descubram grandes atletas. Com esses pequenos passos, o Brasil poderá fazer uma grande maratona."], "sistema": {"C1": 160, "C2": 160, "C3": 160, "C4": 160, "C5": 160}, "feedback": "<h3>Pontos fortes<\/h3><ul>\n<li><span class=c>C1:<\/span> Boa articulação de ideias e desenvolvimento coerente do tema ao longo do texto.<\/li>\n<li><span class=c>C1:<\/span> Uso adequado de conectivos que garantem a coesão entre os parágrafos.<\/li>\n<li><span class=c>C2:<\/span> Você desenvolveu o tema de forma clara, apresentando argumentos relevantes sobre benefícios sociais e de saúde do esporte.<\/li>\n<li><span class=c>C2:<\/span> A proposta de intervenção está bem estruturada, indicando agentes, ações e justificativas coerentes.<\/li>\n<li><span class=c>C3:<\/span> Você trouxe dados da Organização Mundial da Saúde, o que demonstra capacidade de selecionar informações relevantes e dar sustentação ao seu ponto de vista.<\/li>\n<li><span class=c>C3:<\/span> A redação apresenta diferentes dimensões do esporte (saúde, inclusão, mobilidade social) e propõe soluções concretas, mostrando organização temática.<\/li>\n<li><span class=c>C4:<\/span> Uso adequado de conectivos como &quot;Assim&quot;, &quot;Além disso&quot; e &quot;Fica clara, portanto&quot; que garantem a continuidade lógica entre as ideias.<\/li>\n<li><span class=c>C4:<\/span> Variedade de recursos de referência (pronomes demonstrativos, sinônimos e elipses) que evitam repetições e mantêm a fluidez do texto.<\/li>\n<li><span class=c>C5:<\/span> Apresentou proposta de intervenção envolvendo diferentes agentes (Governo Federal, Ministério do Esporte, Ministério da Educação, ONGs e prefeituras), demonstrando articulação com a discussão desenvolvida no texto.<\/li>\n<li><span class=c>C5:<\/span> A proposta está relacionada ao tema ao enfatizar a importância da prática esportiva para inclusão social e saúde.<\/li>\n<\/ul><h3>O que corrigir, trecho a trecho<\/h3><ol>\n<li>&ldquo;Historicamente, o esporte se fez necessário.&rdquo;<ul>\n<li><span class=c>C2:<\/span> O trecho não demonstra claramente a relação entre a necessidade histórica do esporte e o aprendizado que se pretende discutir; falta aprofundamento e conexão direta com o tema proposto, o que enfraquece a argumentação.<br><i>Sugestão:<\/i> Historicamente, o esporte sempre foi necessário como meio de promover valores e aprendizagens para a sociedade.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Com isso, o mundo viu o primeiro grande ensinamento dos esportes: o legado da paz.&rdquo;<ul>\n<li><span class=c>C3:<\/span> O trecho apresenta uma afirmação genérica sem aprofundamento ou evidência que a sustente, o que impede a construção de um argumento consistente e enfraquece a defesa do ponto de vista.<br><i>Sugestão:<\/i> Com isso, os Jogos Olímpicos da Grécia Antiga foram criados para celebrar a paz entre as cidades-estado, demonstrando que o esporte pode servir como instrumento de conciliação e cooperação entre povos.<\/li>\n<\/ul><\/li>\n<li>&ldquo;os esportistas, os sedentários são seis vezes mais propensos a desenvolverem problemas cardíacos&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de regência verbal: o verbo &quot;desenvolver&quot; não exige a preposição &quot;em&quot;. O infinitivo deve aparecer sem o sufixo &quot;-em&quot;.<br><i>Sugestão:<\/i> os esportistas, os sedentários são seis vezes mais propensos a desenvolver problemas cardíacos<\/li>\n<\/ul><\/li>\n<li>&ldquo;Não existem negros ou branco, pobres ou ricos.&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de concordância nominal: o adjetivo deve concordar em número com o substantivo ao qual se refere.<br><i>Sugestão:<\/i> Não existem negros ou brancos, pobres ou ricos.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Fica clara, portanto, a necessidade de incentivar o desporto.&rdquo;<ul>\n<li><span class=c>C4:<\/span> A expressão &quot;Fica clara, portanto&quot; funciona como um conectivo fraco porque não estabelece de forma explícita a relação de causa‑efeito entre o parágrafo anterior (que trata dos benefícios do esporte) e a proposta de intervenção. A coesão fica comprometida, pois o leitor pode não perceber imediatamente que a necessidade de incentivo decorre dos argumentos apresentados.<br><i>Sugestão:<\/i> Diante dos benefícios já expostos, torna‑se evidente a necessidade de incentivar o desporto.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Cabe ao Governo Federal promover, junto com o Ministério do Esporte, a construção de parques e praças esportivas comunitárias.&rdquo;<ul>\n<li><span class=c>C5:<\/span> A proposta não detalha o modo/meio de execução nem o efeito esperado. Falta especificar como será feita a construção (ex.: mediante convênios, licitação transparente), quais recursos serão destinados e quais resultados concretos se pretende alcançar (ex.: aumento de 20% da prática esportiva nas comunidades).<br><i>Sugestão:<\/i> Cabe ao Governo Federal, em parceria com o Ministério do Esporte, firmar convênios com municípios para a construção de parques e praças esportivas comunitárias, destinando recursos financeiros via Lei de Incentivo ao Esporte e estabelecendo metas de conclusão em até 24 meses; o efeito esperado é ampliar em 20% a participação de crianças e adolescentes em atividades físicas nas áreas atendidas.<\/li>\n<\/ul><\/li>\n<li>&ldquo;As ONGs e prefeituras devem investir recursos nas comunidades carentes, proporcionando caminhos para que os jovens se descubram grandes atletas.&rdquo;<ul>\n<li><span class=c>C5:<\/span> A ação não indica claramente qual recurso será investido, como será operacionalizada nem qual o impacto mensurável. Falta definir o tipo de investimento (ex.: bolsas‑estudo, infraestrutura de treinamento) e o efeito concreto (ex.: aumento de 15% de jovens inscritos em programas esportivos).<br><i>Sugestão:<\/i> As ONGs e prefeituras devem destinar bolsas‑estudo e equipamentos esportivos às comunidades carentes, criando centros de treinamento com acompanhamento de técnicos qualificados; assim, espera‑se que 15% dos jovens beneficiados ingressem em programas de alto rendimento dentro de dois anos.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Com esses pequenos passos, o Brasil poderá fazer uma grande maratona.&rdquo;<ul>\n<li><span class=c>C3:<\/span> A conclusão utiliza uma metáfora vaga que não retoma de forma clara os argumentos desenvolvidos ao longo do texto, comprometendo a coesão e a consistência da defesa do ponto de vista.<br><i>Sugestão:<\/i> Com a implementação dessas políticas, o Brasil avançará significativamente na promoção da saúde e da inclusão social, consolidando o esporte como agente transformador na vida dos cidadãos.<\/li>\n<\/ul><\/li>\n<\/ol><h3>Como melhorar<\/h3><ul>\n<li><span class=c>C1:<\/span> Revise a regência dos verbos, especialmente ao usar infinitivos após preposições.<\/li>\n<li><span class=c>C1:<\/span> Atente-se à concordância de gênero e número entre substantivos e adjetivos.<\/li>\n<li><span class=c>C1:<\/span> Faça uma leitura final focada apenas na gramática para identificar pequenos deslizes antes de entregar a redação.<\/li>\n<li><span class=c>C2:<\/span> Enriqueça seus argumentos com repertório sociocultural mais diversificado, citando exemplos concretos de diferentes esportes e contextos culturais.<\/li>\n<li><span class=c>C2:<\/span> Estabeleça conexões explícitas entre cada argumento e o tema central, mostrando como cada benefício do esporte responde à pergunta proposta.<\/li>\n<li><span class=c>C2:<\/span> Aprimore a proposta de intervenção detalhando etapas, prazos e indicadores de avaliação, reforçando a viabilidade das ações sugeridas.<\/li>\n<li><span class=c>C3:<\/span> Aprofunde cada argumento com exemplos mais específicos e, sempre que possível, cite fontes ou dados que reforcem a sua tese.<\/li>\n<li><span class=c>C3:<\/span> Estabeleça conexões explícitas entre os parágrafos, usando conectivos que mostrem a progressão lógica das ideias.<\/li>\n<li><span class=c>C3:<\/span> Na conclusão, retome os principais pontos desenvolvidos e apresente uma proposta final que sintetize a defesa do ponto de vista de forma clara e impactante.<\/li>\n<li><span class=c>C4:<\/span> Substitua conectivos genéricos por expressões que explicitam a relação lógica (ex.: &quot;Diante disso&quot;, &quot;Por isso&quot;, &quot;Consequentemente&quot;).<\/li>\n<li><span class=c>C4:<\/span> Varie os recursos de referência, alternando pronomes demonstrativos, sinônimos e elipses, para evitar repetições e reforçar a articulação entre parágrafos.<\/li>\n<li><span class=c>C4:<\/span> Reforce a coesão entre ideias de intervenção e os argumentos desenvolvidos, usando conectivos que indiquem claramente causa, consequência ou finalidade.<\/li>\n<li><span class=c>C5:<\/span> Detalhar o modo/meio de cada ação (ex.: convênios, licitações, bolsas‑estudo) e especificar os recursos financeiros ou materiais necessários.<\/li>\n<li><span class=c>C5:<\/span> Estabelecer indicadores de efeito mensuráveis (percentuais de aumento de participação, metas de prazo) para demonstrar o impacto esperado da intervenção.<\/li>\n<li><span class=c>C5:<\/span> Ampliar a sequência lógica da proposta, indicando quem será responsável por monitorar e avaliar os resultados, garantindo a viabilidade e a sustentabilidade das ações.<\/li>\n<\/ul>"}, {"cod": "F10", "tema": "O suicídio entre os jovens: como resolver esse problema?", "titulo": "Um grito silencioso", "motivadores": "<p>O suicídio pode ser causado por vários fatores, dentre eles um excessivo grau de sofrimento. É definido como a atitude individual de exterminar a própria vida. O sofrimento que o indivíduo apresenta pode ser verdadeiro ou proveniente de algum transtorno afetivo, como em quadros de psicose aguda ou depressão delirante. [Brasil Escola] Leia o texto na íntegra\nDesde que dois alunos do Colégio Bandeirantes, tradicional escola de elite de São Paulo, se mataram no espaço de 15 dias no mês de abril, o suicídio de adolescentes entrou no debate público no Brasil. Psicanalistas e profissionais de saúde mental têm sido chamados à rede privada de ensino para falar sobre o tema. Pais e professores estão em busca de pistas para compreender por que mais jovens tiram a própria vida e como é possível prevenir a tragédia. Casos de adolescentes que se matam já fazem parte da crônica das cidades de todos os tamanhos no país, do Rio Grande do Sul aos estados da Amazônia. No Brasil, entre 2000 a 2015, os suicídios aumentaram 65% dos 10 aos 14 anos e 45% dos 15 aos 19 anos, segundo levantamento do sociólogo Julio Jacobo Waiselfisz, coordenador do Mapa da Violência no Brasil. Nos últimos dois anos, os números podem indicar uma pequena estabilização, mas só daqui mais um ano será possível afirmar se é uma tendência ou apenas uma oscilação. No mundo, o suicídio já é a segunda causa de morte entre adolescentes, segundo a Organização Mundial da Saúde. [El País] Leia o texto na íntegra\nO Ministério da Saúde tem uma “agenda estratégica” de combate ao mal, com a meta de reduzir em 10% a mortalidade por suicídio até 2020 por meio de “ampliação da vigilância, prevenção e atenção integral”, mas Souza opina que são necessárias campanhas de saúde pública mais amplas, a exemplo do que é feito com doenças infecciosas. [BBC] Leia o texto na íntegra\n<\/p>", "paragrafos": ["O suicídio é um grave problema que tem se alastrado pela sociedade e ignorado por muitos atualmente. É um problema que tem principalmente se alastrado entre os adolescentes em diversas partes do mundo. Mas qual seria o motivo de tal problema afinal? A resposta para isso não teria apenas um motivo, mas sim um conjunto de problemas e que levam ao suicídio, dentre eles principalmente a depressão. O ambiente familiar e a escola durante a adolescência são os principais locais de onde a maioria desses problemas surgem.", "Muitos podem acabar sofrendo nessa época da vida com problemas como preconceito, rejeição familiar e social, exclusão social, bullying, baixa auto-estima, diversos tipos de ansiedade, pressão familiar ou social, todos problemas que podem por alguém mentalmente fraco em estado depressão. Diante a todos esse problemas muitos podem ficar confusos e desesperados sem saber o que fazer, sem saber a quem recorrer ou até mesmo não tem a quem recorrer, ficando calados com seus problemas, podendo acarrentar a depressão. É diante a isso, que muitos recorrem a última alternativa e acabam tirando a sua própria vida.", "Apesar desse enorme problema ser mais recorrente do que muitos pensam, não é muito discutido atualmente e até mesmo ignorado pela sociedade. Por conta disso mais e mais pessoas acabam sendo vítimas de tal tragédia.", "Com isso é possível concluir que é extremamente necessário que mais atenção seja voltada ao tópico do suicídio e ao de sua raíz, a depressão. As pessoas no geral precisam apoiar aqueles que possam parecer necessitados, e o governo elaborar campanhas de conscientização e de ajuda especializada."], "sistema": {"C1": 120, "C2": 120, "C3": 120, "C4": 120, "C5": 120}, "feedback": "<h3>Pontos fortes<\/h3><ul>\n<li><span class=c>C1:<\/span> Você demonstra clareza ao identificar a depressão como um dos principais fatores do suicídio entre jovens, o que mantém a argumentação coerente.<\/li>\n<li><span class=c>C1:<\/span> O texto apresenta boa organização temática, com introdução, desenvolvimento e conclusão, evitando que a nota caia para níveis mais baixos.<\/li>\n<li><span class=c>C2:<\/span> Você demonstra compreensão da proposta ao abordar diretamente o tema do suicídio entre jovens e ao apresentar uma conclusão que propõe ações (apoio social e campanhas governamentais).<\/li>\n<li><span class=c>C2:<\/span> A estrutura básica de introdução, desenvolvimento e conclusão está presente, o que impede que a nota seja inferior.<\/li>\n<li><span class=c>C3:<\/span> Apresenta informações e fatos relevantes sobre depressão, bullying e pressão familiar, demonstrando compreensão do tema.<\/li>\n<li><span class=c>C3:<\/span> Defende um ponto de vista claro ao afirmar a necessidade de maior atenção e campanhas de conscientização.<\/li>\n<li><span class=c>C4:<\/span> Você consegue estabelecer a relação entre depressão, ambiente familiar e escolar e o suicídio, mantendo o foco no tema ao longo do texto.<\/li>\n<li><span class=c>C4:<\/span> Há uso de conectivos básicos (porém, apesar de, com isso) que permitem alguma continuidade entre as ideias.<\/li>\n<li><span class=c>C5:<\/span> Você identificou claramente a relação entre depressão, bullying e outros fatores de risco, demonstrando compreensão do problema central.<\/li>\n<li><span class=c>C5:<\/span> Apresentou a necessidade de campanhas de conscientização e apoio governamental, indicando que pensou em soluções externas ao indivíduo.<\/li>\n<\/ul><h3>O que corrigir, trecho a trecho<\/h3><ol>\n<li>&ldquo;Mas qual seria o motivo de tal problema afinal?&rdquo;<ul>\n<li><span class=c>C4:<\/span> O conectivo &quot;Mas&quot; inicia um parágrafo sem estabelecer relação clara com o anterior; o uso de &quot;afinal&quot; é redundante e não contribui para a coesão textual.<br><i>Sugestão:<\/i> Qual seria, portanto, o motivo desse problema?<\/li>\n<\/ul><\/li>\n<li>&ldquo;O ambiente familiar e a escola durante a adolescência são os principais locais de onde a maioria desses problemas surgem.&rdquo;<ul>\n<li><span class=c>C3:<\/span> O trecho apresenta uma sequência de ideias confusa e falta de coesão. Não há conexão explícita entre os diferentes fatores citados, o que impede a construção de um argumento bem estruturado e dificulta a defesa do ponto de vista.<br><i>Sugestão:<\/i> O ambiente familiar e a escola, durante a adolescência, são os principais locais onde surgem a maioria desses problemas.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Diante a todos esse problemas muitos podem ficar confusos&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de regência e concordância: a preposição correta é &quot;diante de&quot;; o pronome demonstrativo &quot;esses&quot; concorda com &quot;problemas&quot; (plural); o verbo &quot;ficar&quot; exige o adjetivo &quot;confusos&quot; no plural.<br><i>Sugestão:<\/i> Diante de todos esses problemas, muitos podem ficar confusos<\/li>\n<li><span class=c>C2:<\/span> O trecho não desenvolve um argumento consistente; a ideia está vaga e não demonstra relação clara entre os problemas citados e a consequência da confusão, enfraquecendo a coerência argumentativa exigida na competência C2.<br><i>Sugestão:<\/i> Diante de todos esses problemas, muitos jovens podem ficar confusos e desorientados.<\/li>\n<\/ul><\/li>\n<li>&ldquo;É diante a isso, que muitos recorrem&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de regência e pontuação: a expressão correta é &quot;É diante disso que&quot; (sem vírgula após &quot;isso&quot;).<br><i>Sugestão:<\/i> É diante disso que muitos recorrem<\/li>\n<li><span class=c>C2:<\/span> A expressão “diante a isso” interrompe a progressão lógica do argumento e não estabelece de forma clara a causa‑efeito que deveria conectar a situação descrita à decisão de suicídio, comprometendo a consistência da argumentação.<br><i>Sugestão:<\/i> É diante disso que muitos recorrem à última alternativa.<\/li>\n<\/ul><\/li>\n<li>&ldquo;É diante a isso, que muitos recorrem a última alternativa e acabam tirando a sua própria vida.&rdquo;<ul>\n<li><span class=c>C4:<\/span> A sequência de conectivos está confusa: &quot;É diante a isso&quot; não cria uma ligação lógica adequada com a ideia anterior; falta um conectivo que indique consequência de forma mais direta.<br><i>Sugestão:<\/i> Diante disso, muitos recorrem à última alternativa e acabam tirando a própria vida.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Com isso é possível concluir que é extremamente necessário que mais atenção seja voltada ao tópico do suicídio e ao de sua raíz, a depressão.&rdquo;<ul>\n<li><span class=c>C3:<\/span> A relação entre as ideias está fraca; a conclusão aparece de forma abrupta, sem retomar os argumentos desenvolvidos ao longo do texto. Falta uma transição que una as causas apresentadas à proposta de solução, comprometendo a organização da argumentação.<br><i>Sugestão:<\/i> Diante desses fatores, conclui‑se que é imprescindível direcionar maior atenção ao suicídio e, sobretudo, à sua raiz: a depressão.<\/li>\n<\/ul><\/li>\n<li>&ldquo;As pessoas no geral precisam apoiar aqueles que possam parecer necessitados, e o governo elaborar campanhas de conscientização e de ajuda especializada.&rdquo;<ul>\n<li><span class=c>C5:<\/span> A proposta não está detalhada nos cinco elementos exigidos (agente, ação, modo/meio, efeito e detalhamento). Falta especificar quem exatamente (agente) vai executar a ação, como será feita (modo/meio), quais recursos serão usados e qual impacto esperado (efeito). Além disso, a redação apresenta duas ideias distintas em uma única frase, sem desenvolver cada uma de forma completa.<br><i>Sugestão:<\/i> O governo, por meio do Ministério da Saúde e da Educação, deve criar e financiar programas de apoio psicológico nas escolas, oferecendo atendimento gratuito por psicólogos especializados; esses programas deverão incluir oficinas de prevenção ao bullying e treinamento de professores para identificar sinais de depressão, garantindo que os jovens recebam apoio imediato e reduzindo a taxa de suicídio entre adolescentes.<\/li>\n<\/ul><\/li>\n<li>&ldquo;pode acarrentar a depressão&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de ortografia e escolha lexical: o verbo correto é &quot;acarrear&quot; (com duas &quot;r&quot;).<br><i>Sugestão:<\/i> pode acarretar a depressão<\/li>\n<\/ul><\/li>\n<li>&ldquo;a raiz, a depressão&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de pontuação: a vírgula antes de &quot;a depressão&quot; cria uma pausa desnecessária; o termo deve ser ligado ao substantivo anterior.<br><i>Sugestão:<\/i> a raiz da depressão<\/li>\n<\/ul><\/li>\n<\/ol><h3>Como melhorar<\/h3><ul>\n<li><span class=c>C1:<\/span> Revisar a regência das preposições e a concordância nominal e verbal em cada frase; pratique com exercícios de gramática focados nesses pontos.<\/li>\n<li><span class=c>C1:<\/span> Fazer uma leitura atenta do texto final, procurando por erros ortográficos e de pontuação; use ferramentas de correção ou peça a alguém para revisar antes de entregar.<\/li>\n<li><span class=c>C1:<\/span> Amplie o repertório de conectivos e mantenha a coerência no registro formal, evitando expressões coloquiais e garantindo que a pontuação reflita a estrutura lógica das ideias.<\/li>\n<li><span class=c>C2:<\/span> Construa argumentos mais aprofundados, explicando como cada fator (bullying, pressão familiar, etc.) contribui diretamente para o aumento do risco de suicídio, evitando generalizações.<\/li>\n<li><span class=c>C2:<\/span> Utilize conectivos lógicos (por exemplo, “consequentemente”, “por isso”, “assim”) para garantir a coesão entre as ideias e tornar a sequência argumentativa mais clara e persuasiva.<\/li>\n<li><span class=c>C2:<\/span> Apresente propostas de intervenção detalhadas, indicando quem deve agir (escolas, famílias, governo), como agir (programas de apoio psicológico, treinamento de professores) e quais resultados se esperam, cumprindo os requisitos da proposta de solução.<\/li>\n<li><span class=c>C3:<\/span> Estruture o texto em blocos claros: introdução (apresentação do problema), desenvolvimento (exposição de causas e dados) e conclusão (propostas de solução), garantindo transições lógicas entre eles.<\/li>\n<li><span class=c>C3:<\/span> Use conectivos argumentativos (por exemplo, &quot;além disso&quot;, &quot;consequentemente&quot;, &quot;por isso&quot;) para articular as ideias e reforçar a defesa do ponto de vista.<\/li>\n<li><span class=c>C3:<\/span> Enriqueça a argumentação com exemplos concretos (casos reais, políticas públicas existentes) que sustentem suas propostas, demonstrando autoria e profundidade na análise.<\/li>\n<li><span class=c>C4:<\/span> Varie os conectivos de causa, consequência, adição e contraste (por exemplo: &quot;por isso&quot;, &quot;consequentemente&quot;, &quot;além disso&quot;, &quot;no entanto&quot;) para evitar repetições e melhorar a fluidez entre os parágrafos.<\/li>\n<li><span class=c>C4:<\/span> Planeje a estrutura do texto antes de escrever, definindo quais ideias serão ligadas por cada conectivo, garantindo que cada parágrafo tenha uma função clara (introdução, desen
