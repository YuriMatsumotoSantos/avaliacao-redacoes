volvimento, conclusão).<\/li>\n<li><span class=c>C4:<\/span> Revise a coesão referencial, substituindo repetições de termos por pronomes ou sinônimos adequados, de modo que o leitor consiga identificar facilmente a quem ou a que se refere cada pronome.<\/li>\n<li><span class=c>C5:<\/span> Defina claramente o agente da intervenção (ex.: Ministério da Saúde, escolas, ONGs) e descreva a ação que cada um realizará.<\/li>\n<li><span class=c>C5:<\/span> Especifique o modo/meio de execução (ex.: criação de salas de apoio, linhas telefônicas 24h, campanhas nas redes sociais) e detalhe os recursos necessários (ex.: profissionais, materiais, financiamento).<\/li>\n<li><span class=c>C5:<\/span> Apresente o efeito esperado da intervenção (ex.: diminuição de casos de depressão, aumento de buscas por ajuda) e explique como será monitorado o impacto, reforçando a ligação com a discussão desenvolvida no texto.<\/li>\n<\/ul>"}]</script>
<script>
(function () {
  "use strict";
  var KIT = "piloto-F01-F10";
  var ITENS = JSON.parse(document.getElementById("dados").textContent);
  var COMPS = ["C1", "C2", "C3", "C4", "C5"];
  var DESC = {
    C1: "Norma escrita formal", C2: "Tema e tipo textual", C3: "Argumentação",
    C4: "Coesão", C5: "Proposta de intervenção"
  };
  var CRIT = [
    ["especificidade", "Especificidade", "O feedback aponta trechos e problemas desta redação?", "genérico, serviria para qualquer redação", "aponta trechos e problemas concretos"],
    ["acionabilidade", "Ajuda a melhorar", "O estudante saberia o que fazer na próxima redação?", "não saberia o que fazer", "orientações claras e aplicáveis"],
    ["correcao", "Correção", "O que o feedback diz é verdade e está na competência certa?", "afirma coisas falsas ou erradas", "tudo procede, na competência certa"],
    ["alinhamento", "Combina com a nota", "A gravidade dos problemas e elogios acompanha a nota do sistema?", "contradiz a nota", "acompanha a nota de cada competência"]
  ];
  var CHAVE = "avaliacao-redacoes:" + KIT;
  var app = document.getElementById("app");
  var guardaOk = true;

  function novo() { return { avaliadora: "", atual: 0, itens: {}, ultimaCopia: null, desdeCopia: 0 }; }
  var est = novo();
  try {
    var s = localStorage.getItem(CHAVE);
    if (s) est = Object.assign(novo(), JSON.parse(s));
    localStorage.setItem(CHAVE + ":teste", "1");
    localStorage.removeItem(CHAVE + ":teste");
  } catch (e) { guardaOk = false; }

  function item(cod) {
    if (!est.itens[cod]) est.itens[cod] = { notas: {}, problemas: "", travadoEm: "", crit: {}, comentario: "", concluido: false };
    return est.itens[cod];
  }
  function salvar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(est)); } catch (e) { guardaOk = false; }
    avisos();
  }
  function estado(cod) {
    var r = est.itens[cod];
    if (!r || (!r.travadoEm && !Object.keys(r.notas).length)) return ["", "a fazer"];
    if (r.concluido) return ["cheia", "concluída"];
    if (r.travadoEm) return ["meia", "falta o sistema"];
    return ["", "em andamento"];
  }
  function nConcluidas() { return ITENS.filter(function (it) { return (est.itens[it.cod] || {}).concluido; }).length; }
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function quando(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("pt-BR") + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function avisos() {
    var av = document.getElementById("aviso"), t = document.getElementById("aviso-txt");
    var msg = "";
    if (!guardaOk) msg = "Este navegador não está guardando o seu progresso (talvez seja uma janela anônima). Ao terminar cada redação, clique em Baixar respostas para não perder nada.";
    else if (est.desdeCopia >= 3) msg = "Você concluiu " + est.desdeCopia + " redações desde a última cópia. Que tal clicar em Baixar respostas para guardar uma cópia?";
    t.textContent = msg;
    av.classList.toggle("oculto", !msg);
    var n = nConcluidas();
    document.getElementById("progresso").innerHTML = est.avaliadora ? "<strong>" + n + " de " + ITENS.length + "</strong> concluídas" : "";
  }

  /* ---------- tutorial ---------- */
  function tutorial(primeira) {
    app.innerHTML = "";
    app.appendChild(document.getElementById("t-tutorial").content.cloneNode(true));
    document.getElementById("t-n").textContent = ITENS.length;
    document.getElementById("t-inicio").classList.toggle("oculto", !primeira);
    document.getElementById("t-voltar").classList.toggle("oculto", primeira);
    if (primeira) {
      var inp = document.getElementById("nome-av");
      inp.value = est.avaliadora;
      var ir = function () {
        var v = inp.value.trim();
        document.getElementById("nome-falta").classList.toggle("oculto", !!v);
        if (!v) { inp.focus(); return; }
        est.avaliadora = v; salvar(); avaliar(est.atual);
      };
      document.getElementById("bt-comecar").onclick = ir;
      inp.onkeydown = function (e) { if (e.key === "Enter") ir(); };
    } else {
      document.getElementById("bt-voltar").onclick = function () { avaliar(est.atual); };
    }
    app.scrollTop = 0;
  }

  /* ---------- tela de avaliação ---------- */
  function ovais(nome, valores, marcado, travado, peq) {
    return '<div class="ovais">' + valores.map(function (v) {
      return '<label class="oval' + (peq ? " p" : "") + '"><input type="radio" name="' + nome + '" value="' + v + '"' +
        (String(marcado) === String(v) ? " checked" : "") + (travado ? " disabled" : "") + '><span>' + v + "</span></label>";
    }).join("") + "</div>";
  }

  function avaliar(i) {
    est.atual = i; salvar();
    var it = ITENS[i], r = item(it.cod), trav = !!r.travadoEm;
    app.innerHTML = "";
    var mesa = el("div", { "class": "mesa" });

    // lista
    var lista = el("nav", { "class": "lista", "aria-label": "Redações" }, '<h2 class="rotulo">Redações</h2>');
    var ol = el("ol");
    ITENS.forEach(function (x, k) {
      var e = estado(x.cod);
      var li = el("li");
      var b = el("button", { type: "button" }, '<span class="marca ' + e[0] + '" aria-hidden="true"></span><span><span class="cod">' + x.cod + '</span><span class="est">' + e[1] + "</span></span>");
      if (k === i) b.setAttribute("aria-current", "true");
      b.onclick = function () { avaliar(k); };
      li.appendChild(b); ol.appendChild(li);
    });
    lista.appendChild(ol);

    // folha
    var folha = el("article", { "class": "folha" });
    folha.innerHTML =
      '<div class="folha-cab"><h1>' + it.cod + ' <span class="posicao">redação ' + (i + 1) + " de " + ITENS.length + "</span></h1>" +
      '<p class="tema"><span class="rotulo">Tema</span><br>' + esc(it.tema) + "</p>" +
      '<p class="tit">Título dado pelo estudante: ' + esc(it.titulo) + "</p>" +
      (it.motivadores ? '<details class="motiv"><summary>Ler a proposta completa e os textos motivadores</summary><div class="motiv-txt">' + it.motivadores + "</div></details>" : "") +
      "</div>" +
      '<div class="pautado"><div class="nums" aria-hidden="true"></div><div class="texto">' + it.paragrafos.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div></div>" +
      '<p class="dica-linha">As linhas são numeradas para você poder citar trechos, como "linha 7".</p>' +
      (trav
        ? '<section class="parecer" aria-labelledby="h-parecer"><h2 id="h-parecer">Etapa 2: feedback do sistema</h2>' + it.feedback + "</section>"
        : '<div class="bloqueado"><svg class="cadeado" viewBox="0 0 16 18" aria-hidden="true"><rect x="1.5" y="7.5" width="13" height="9.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 7.5V5a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>A avaliação do sistema aparece aqui depois que você confirmar a sua nota.</div>');

    // grade
    var grade = el("aside", { "class": "grade", "aria-label": "Grade de correção" });
    var h = '<div class="grade-cab"><h2>' + (trav ? (r.concluido ? "Redação concluída" : "Avalie o feedback do sistema") : "Etapa 1: a sua correção") + "</h2>" +
      "<p>" + (trav ? "Sua nota já está registrada. Agora leia o feedback do sistema, à esquerda." : "Marque uma nota por competência, como na banca do ENEM.") + "</p></div>";
    h += '<div class="grade-corpo"><form id="f" novalidate>';
    h += '<div class="etapa">';
    COMPS.forEach(function (c) {
      h += '<fieldset class="comp"><legend>' + c + ' <span class="desc">' + DESC[c] + "</span></legend>" + ovais("n" + c, [0, 40, 80, 120, 160, 200], r.notas[c], trav) + "</fieldset>";
    });
    h += '<div class="total"><span>Sua nota total</span><output id="total"></output></div>';
    h += '<label class="campo" for="problemas">Principais problemas que você apontaria<small>Dois ou três, em poucas palavras.</small></label>' +
      '<textarea id="problemas" placeholder="Exemplo: linha 4, concordância em &quot;os caminhoneiro&quot;. A proposta de intervenção não diz quem vai agir."' + (trav ? " disabled" : "") + ">" + esc(r.problemas) + "</textarea>";
    if (!trav) {
      h += '<p class="falta oculto" id="falta1"></p><p style="margin:14px 0 0"><button class="bt bt-cheio bt-grande" id="bt-travar" type="button">Confirmar minha nota e ver o sistema</button></p>' +
        '<div class="certeza oculto" id="certeza" role="group" aria-label="Confirmar a nota"><p>Depois de confirmar, você não poderá mais mudar a nota nem os problemas desta redação.</p>' +
        '<button class="bt bt-cheio bt-grande" id="bt-sim" type="button">Sim, confirmar e ver o sistema</button>' +
        '<button class="bt bt-grande" id="bt-revisar" type="button" style="margin-top:8px">Voltar e revisar</button></div>';
    } else {
      h += '<p class="registro">Sua nota foi registrada em ' + quando(r.travadoEm) + " e não pode mais ser alterada.</p>";
    }
    h += "</div>";
    if (trav) {
      h += '<div class="etapa"><span class="rotulo" style="color:var(--sistema)">Etapa 2</span>' +
        '<table class="compara"><tr><th></th>' + COMPS.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "<th>Total</th></tr>" +
        "<tr><td>Você</td>" + COMPS.map(function (c) { return "<td>" + r.notas[c] + "</td>"; }).join("") + "<td>" + soma(r.notas) + "</td></tr>" +
        '<tr class="sis"><td>Sistema</td>' + COMPS.map(function (c) { return "<td>" + it.sistema[c] + "</td>"; }).join("") + "<td>" + soma(it.sistema) + "</td></tr></table>";
      CRIT.forEach(function (k) {
        h += '<fieldset class="crit"><legend>' + k[1] + '</legend><p class="perg">' + k[2] + "</p>" + ovais("k" + k[0], [1, 2, 3, 4, 5], r.crit[k[0]], false, true) +
          '<div class="escala"><span>1: ' + k[3] + "</span><span>5: " + k[4] + "</span></div></fieldset>";
      });
      h += '<label class="campo" for="comentario">Comentário (opcional)<small>Um erro grave do feedback ou algo que chamou a sua atenção.</small></label>' +
        '<textarea id="comentario" style="min-height:76px">' + esc(r.comentario) + "</textarea>" +
        '<p class="falta oculto" id="falta2"></p>' +
        '<p style="margin:14px 0 0"><button class="bt bt-cheio bt-grande" id="bt-concluir" type="button">' + (i + 1 < ITENS.length ? "Concluir e ir para a próxima" : "Concluir a última redação") + "</button></p>";
      h += "</div>";
    }
    h += '<div class="navega"><button class="bt-link" type="button" id="bt-ant"' + (i === 0 ? " disabled" : "") + ">Anterior</button><button class=\"bt-link\" type=\"button\" id=\"bt-prox\"" + (i + 1 === ITENS.length ? " disabled" : "") + ">Pular para a próxima</button></div>";
    h += "</form></div>";
    grade.innerHTML = h;

    mesa.appendChild(lista); mesa.appendChild(folha); mesa.appendChild(grade);
    app.appendChild(mesa);
    numerar(folha);
    ligar(it, r, i);
    avisos();
    app.scrollTop = 0;
  }

  function soma(n) { var t = 0, ok = true; COMPS.forEach(function (c) { if (n[c] == null || n[c] === "") ok = false; else t += Number(n[c]); }); return ok ? t : "?"; }

  function numerar(folha) {
    var txt = folha.querySelector(".texto"), nums = folha.querySelector(".nums");
    var lh = parseFloat(getComputedStyle(txt).lineHeight);
    var n = Math.round(txt.scrollHeight / lh);
    var out = [];
    for (var k = 1; k <= n; k++) out.push(k);
    nums.innerHTML = out.join("<br>");
  }

  function ligar(it, r, i) {
    var f = document.getElementById("f");
    var total = document.getElementById("total");
    var mostrarTotal = function () {
      var t = soma(r.notas), faltam = COMPS.filter(function (c) { return r.notas[c] == null; }).length;
      total.textContent = t === "?" ? "faltam " + faltam : t;
      total.classList.toggle("parcial", t === "?");
    };
    mostrarTotal();
    f.addEventListener("change", function (e) {
      var n = e.target.name;
      if (!n) return;
      if (n[0] === "n" && !r.travadoEm) { r.notas[n.slice(1)] = Number(e.target.value); mostrarTotal(); }
      if (n[0] === "k") r.crit[n.slice(1)] = Number(e.target.value);
      salvar();
      if (n[0] === "n") atualizarLista();
    });
    var pb = document.getElementById("problemas");
    pb.addEventListener("input", function () { if (!r.travadoEm) { r.problemas = pb.value; salvar(); } });
    var cm = document.getElementById("comentario");
    if (cm) cm.addEventListener("input", function () { r.comentario = cm.value; salvar(); });

    var bt = document.getElementById("bt-travar");
    if (bt) bt.onclick = function () {
      var faltam = COMPS.filter(function (c) { return r.notas[c] == null; });
      var msg = faltam.length ? "Falta marcar a nota de " + faltam.join(", ") + "." : (!r.problemas.trim() ? "Escreva os principais problemas que você apontaria." : "");
      var fl = document.getElementById("falta1");
      fl.textContent = msg; fl.classList.toggle("oculto", !msg);
      if (msg) return;
      // confirmacao dentro da grade: a caixa nativa do navegador assusta quem nao e da area
      bt.parentNode.classList.add("oculto");
      document.getElementById("certeza").classList.remove("oculto");
      document.getElementById("bt-sim").focus();
    };
    var sim = document.getElementById("bt-sim");
    if (sim) sim.onclick = function () { r.travadoEm = new Date().toISOString(); salvar(); avaliar(i); };
    var rev = document.getElementById("bt-revisar");
    if (rev) rev.onclick = function () {
      document.getElementById("certeza").classList.add("oculto");
      bt.parentNode.classList.remove("oculto");
    };
    var bc = document.getElementById("bt-concluir");
    if (bc) bc.onclick = function () {
      var faltam = CRIT.filter(function (k) { return r.crit[k[0]] == null; }).map(function (k) { return k[1]; });
      var fl = document.getElementById("falta2");
      fl.textContent = faltam.length ? "Falta marcar: " + faltam.join(", ") + "." : "";
      fl.classList.toggle("oculto", !faltam.length);
      if (faltam.length) return;
      if (!r.concluido) { r.concluido = true; est.desdeCopia++; }
      salvar();
      var prox = ITENS.findIndex(function (x, k) { return k > i && !(est.itens[x.cod] || {}).concluido; });
      if (prox < 0) prox = ITENS.findIndex(function (x) { return !(est.itens[x.cod] || {}).concluido; });
      if (prox < 0) final(); else avaliar(prox);
    };
    document.getElementById("bt-ant").onclick = function () { if (i > 0) avaliar(i - 1); };
    document.getElementById("bt-prox").onclick = function () { if (i + 1 < ITENS.length) avaliar(i + 1); };
  }

  function atualizarLista() {
    document.querySelectorAll(".lista li").forEach(function (li, k) {
      var e = estado(ITENS[k].cod);
      li.querySelector(".marca").className = "marca " + e[0];
      li.querySelector(".est").textContent = e[1];
    });
  }

  function final() {
    app.innerHTML = '<section class="tela"><h1>Pronto, você concluiu as ' + ITENS.length + " redações.</h1>" +
      "<p>Muito obrigado pelo seu tempo. Falta só um passo: baixar o arquivo com as suas respostas e enviá-lo para quem te mandou esta avaliação.</p>" +
      '<p><button class="bt bt-cheio" id="bt-fim" type="button">Baixar respostas</button></p>' +
      '<p class="pe">O arquivo se chama respostas_' + esc(slug(est.avaliadora)) + ".csv e costuma ir para a pasta Downloads.</p></section>";
    document.getElementById("bt-fim").onclick = baixar;
    avisos();
  }

  /* ---------- arquivo de respostas (CSV com ;) ---------- */
  var COLS = ["kit", "avaliadora", "codigo"].concat(COMPS, ["total", "problemas", "nota_registrada_em"], CRIT.map(function (k) { return k[0]; }), ["comentario", "concluida"]);
  function slug(s) { return (s || "avaliadora").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "").toLowerCase() || "avaliadora"; }
  function cel(v) { v = v == null ? "" : String(v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function paraCSV() {
    var linhas = [COLS.join(";")];
    ITENS.forEach(function (it) {
      var r = est.itens[it.cod] || { notas: {}, crit: {} };
      var t = soma(r.notas);
      linhas.push([KIT, est.avaliadora, it.cod].concat(COMPS.map(function (c) { return r.notas[c]; }), [t === "?" ? "" : t, r.problemas, r.travadoEm],
        CRIT.map(function (k) { return r.crit[k[0]]; }), [r.comentario, r.concluido ? "sim" : "nao"]).map(cel).join(";"));
    });
    return "﻿" + linhas.join("\r\n") + "\r\n";
  }
  function lerCSV(txt) {
    txt = txt.replace(/^﻿/, "");
    var rows = [], row = [], v = "", q = false;
    for (var k = 0; k < txt.length; k++) {
      var ch = txt[k];
      if (q) {
        if (ch === '"') { if (txt[k + 1] === '"') { v += '"'; k++; } else q = false; }
        else v += ch;
      } else if (ch === '"') q = true;
      else if (ch === ";") { row.push(v); v = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && txt[k + 1] === "\n") k++; row.push(v); rows.push(row); row = []; v = ""; }
      else v += ch;
    }
    if (v !== "" || row.length) { row.push(v); rows.push(row); }
    return rows.filter(function (r) { return r.length > 1; });
  }
  function baixar() {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([paraCSV()], { type: "text/csv;charset=utf-8" }));
    a.download = "respostas_" + slug(est.avaliadora) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    est.ultimaCopia = new Date().toISOString(); est.desdeCopia = 0; salvar();
  }
  function carregar(txt) {
    var rows = lerCSV(txt), cab = rows.shift() || [];
    var ix = function (n) { return cab.indexOf(n); };
    if (ix("codigo") < 0 || ix("kit") < 0) { alert("Este arquivo não parece ser um arquivo de respostas desta avaliação."); return; }
    if (rows.length && rows[0][ix("kit")] !== KIT) { alert("Este arquivo é de outra avaliação e não pode ser carregado aqui."); return; }
    if (!confirm("Carregar este arquivo vai substituir o que está guardado neste navegador. Continuar?")) return;
    var novoEst = novo();
    rows.forEach(function (c) {
      var cod = c[ix("codigo")];
      if (!ITENS.some(function (x) { return x.cod === cod; })) return;
      novoEst.avaliadora = c[ix("avaliadora")] || novoEst.avaliadora;
      var r = { notas: {}, crit: {}, problemas: c[ix("problemas")] || "", travadoEm: c[ix("nota_registrada_em")] || "", comentario: c[ix("comentario")] || "", concluido: c[ix("concluida")] === "sim" };
      COMPS.forEach(function (k) { if (c[ix(k)] !== "") r.notas[k] = Number(c[ix(k)]); });
      CRIT.forEach(function (k) { if (c[ix(k[0])] !== "") r.crit[k[0]] = Number(c[ix(k[0])]); });
      novoEst.itens[cod] = r;
    });
    est = novoEst; salvar();
    var pend = ITENS.findIndex(function (x) { return !(est.itens[x.cod] || {}).concluido; });
    if (!est.avaliadora) tutorial(true); else if (pend < 0) final(); else avaliar(pend);
  }
  window.__teste = { paraCSV: paraCSV, lerCSV: lerCSV, carregar: carregar, estado: function () { return est; } };

  document.getElementById("bt-baixar").onclick = baixar;
  document.getElementById("bt-carregar").onclick = function () { document.getElementById("arquivo").click(); };
  document.getElementById("arquivo").onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var rd = new FileReader(); rd.onload = function () { carregar(rd.result); }; rd.readAsText(f, "utf-8");
    e.target.value = "";
  };
  document.getElementById("bt-ajuda").onclick = function () { tutorial(!est.avaliadora); };
  window.addEventListener("resize", function () { var f = document.querySelector(".folha"); if (f) numerar(f); });

  if (!est.avaliadora) tutorial(true); else avaliar(Math.min(est.atual || 0, ITENS.length - 1));
})();
</script>

</html>
