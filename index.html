/* cores do manual da marca UTFPR: preto, amarelo Pantone 7406 C (CMYK 0 20 100 0) e cinza K40 */
:root {
  --mesa: #ebebe8;
  --papel: #ffffff;
  --tinta: #141414;
  --tinta-2: #545454;
  --amarelo: #f1c400;
  --amarelo-claro: #fff6cc;
  --drop: #141414;
  --drop-forte: #141414;
  --drop-pauta: #e2e2de;
  --drop-fundo: #fff6cc;
  --k40: #999999;
  --sistema: #141414;
  --sistema-fundo: #f3f3f0;
  --erro: #a3281b;
  --texto: Georgia, "Times New Roman", serif;
  --marca: Jost, Futura, "Century Gothic", "Segoe UI", sans-serif;
  --ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --pauta: 31px;
}
h1, h2, .rotulo, .topo .titulo b, .bt, .oval span { font-family: var(--marca); }
* { box-sizing: border-box; }
html { background: var(--mesa); color: var(--tinta); }
/* mesa de trabalho: topo fixo e tres colunas com rolagem propria (redacao, grade e lista rolam separadas).
   A largura acompanha a tela (notebook ou monitor) sem mudar a estrutura; abaixo de 1240 px aparece rolagem lateral. */
body { margin: 0; font: 14.5px/1.5 var(--ui); background: var(--mesa); height: 100vh; display: flex; flex-direction: column; overflow-x: auto; overflow-y: hidden; }
body > * { min-width: 1240px; }
#app { flex: 1; min-height: 0; overflow: auto; }
.folha, .grade, .lista { overflow-y: auto; max-height: 100%; scrollbar-width: thin; scrollbar-color: var(--k40) transparent; overscroll-behavior: contain; }
::selection { background: var(--amarelo); color: var(--tinta); }
:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }
button, input, textarea { font: inherit; color: inherit; }
.rotulo { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 600; color: var(--tinta-2); }

/* faixa do topo */
.topo { flex: none; background: var(--papel); }
.topo::after { content: ""; display: block; height: 4px; background: var(--amarelo); } /* faixa amarela da marca, de ponta a ponta */
.topo-in { max-width: 1680px; margin: auto; padding: 8px 28px; display: flex; align-items: center; gap: 18px; }
.assinatura { flex: none; display: flex; align-items: center; gap: 12px; padding-right: 18px; border-right: 1px solid var(--k40); }
.assinatura img { height: 30px; width: auto; display: block; }
.assinatura span { font: 12px/1.3 var(--marca); color: var(--tinta); white-space: nowrap; }
.topo .titulo { line-height: 1.25; flex: 1; min-width: 0; }
.topo .titulo b { display: block; font-size: 15.5px; font-weight: 600; }
.topo .titulo span { font-size: 12px; color: var(--tinta-2); display: block; }
.topo .acoes { flex: none; margin-left: auto; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.progresso { font-size: 13px; color: var(--tinta-2); margin-right: 6px; white-space: nowrap; }
.progresso strong { color: var(--tinta); font-variant-numeric: tabular-nums; }

.bt { border: 1.5px solid var(--tinta); background: var(--papel); color: var(--tinta); padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.bt:hover { background: var(--amarelo-claro); }
.bt-cheio { background: var(--amarelo); color: var(--tinta); border-color: var(--amarelo); }
.bt-cheio:hover { background: #e0b600; border-color: #e0b600; }
.bt-grande { padding: 13px 20px; font-size: 14.5px; width: 100%; }
.bt:disabled { opacity: .45; cursor: not-allowed; }
.bt-link { border: 0; background: none; color: var(--drop-forte); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px; font-size: 13.5px; }

.aviso { flex: none; max-width: 1680px; margin: 12px auto 0; padding: 0 24px; }
.aviso p { margin: 0; padding: 10px 14px; background: #fff4e0; border: 1px solid #d9a441; border-radius: 6px; font-size: 13.5px; }

/* grade principal */
.mesa { max-width: 1680px; height: 100%; margin: 0 auto; padding: 18px 28px; display: grid; grid-template-columns: 150px minmax(0, 1fr) clamp(330px, 26vw, 430px); grid-template-rows: minmax(0, 1fr); gap: 22px; align-items: start; }

/* lista das redações, como a coluna de questões do cartão-resposta */
.lista { background: var(--papel); border: 1px solid var(--drop-pauta); border-radius: 8px; padding: 12px 0; }
.lista h2 { margin: 0 14px 8px; }
.lista ol { list-style: none; margin: 0; padding: 0; }
.lista button { width: 100%; display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; padding: 7px 14px; border: 0; background: none; text-align: left; cursor: pointer; }
.lista button:hover { background: var(--sistema-fundo); }
.lista button[aria-current="true"] { background: var(--amarelo); }
.lista button[aria-current="true"] .est { color: var(--tinta); }
.lista .cod { font: 600 14px/1.2 var(--marca); font-variant-numeric: tabular-nums; display: block; }
.lista .est { font-size: 12px; color: var(--tinta-2); display: block; line-height: 1.2; }
.marca { width: 18px; height: 13px; border: 1.5px solid var(--tinta-2); border-radius: 50%; position: relative; }
.marca.meia::after { content: ""; position: absolute; inset: 0 50% 0 0; background: var(--tinta); border-radius: 9px 0 0 9px; }
.marca.cheia { background: var(--tinta); border-color: var(--tinta); }

/* a folha */
.folha { background: var(--papel); border: 1px solid #cfd6d1; border-radius: 4px; box-shadow: 0 1px 2px rgba(20,30,25,.06), 0 6px 20px rgba(20,30,25,.06); }
/* so a redacao (linhas numeradas) tem largura fixa e centralizada; cabecalho e feedback usam a largura da folha,
   alinhados a esquerda, ate ~115 letras por linha para a leitura nao cansar em monitor grande */
.folha-cab > *, .parecer > * { max-width: 115ch; }
.folha-cab { padding: 22px 32px 16px; border-bottom: 2px solid var(--drop); }
.folha-cab .linha1 { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.folha-cab h1 .posicao { font: 400 14px var(--ui); color: var(--tinta-2); margin-left: 10px; letter-spacing: 0; }
.folha-cab h1 { margin: 2px 0 0; font-size: 26px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.folha-cab .tema { margin: 10px 0 0; font-size: 16.5px; line-height: 1.4; }
.folha-cab .tit { margin: 4px 0 0; font-size: 13.5px; color: var(--tinta-2); }
details.motiv { margin-top: 12px; }
details.motiv summary { cursor: pointer; color: var(--drop-forte); font-weight: 600; font-size: 13.5px; }
details.motiv .motiv-txt { margin-top: 10px; padding: 12px 16px; background: var(--sistema-fundo); border-radius: 6px; font: 14px/1.55 var(--texto); max-height: 340px; overflow: auto; }
details.motiv .motiv-txt p { margin: 0 0 10px; }

.pautado { position: relative; width: 666px; margin: 0 auto; padding: 18px 32px 26px 74px; }
.pautado .nums { position: absolute; left: 0; top: 18px; width: 56px; border-right: 1.5px solid var(--k40); font: 12px/var(--pauta) var(--ui); color: #6b6b6b; text-align: right; padding-right: 10px; font-variant-numeric: tabular-nums; user-select: none; }
.texto { font: 17px/var(--pauta) var(--texto); background-image: linear-gradient(to bottom, transparent calc(var(--pauta) - 1px), var(--drop-pauta) calc(var(--pauta) - 1px)); background-size: 100% var(--pauta); width: 560px; } /* largura fixa: a quebra de linha (e o numero das linhas) e igual em qualquer tela */
.texto p { margin: 0; text-indent: 2.2em; }
.dica-linha { width: 666px; margin: 0 auto 18px; padding-left: 74px; font-size: 12px; color: var(--tinta-2); }

/* parecer do sistema, em outra tinta */
.parecer { border-top: 2px solid var(--sistema); background: var(--sistema-fundo); padding: 22px 32px 30px; border-radius: 0 0 4px 4px; }
.parecer .rotulo { color: var(--sistema); }
.parecer h2 { margin: 2px 0 14px; font-size: 20px; color: var(--sistema); }
.parecer h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; font-stretch: condensed; color: var(--sistema); margin: 22px 0 8px; }
.parecer ul, .parecer ol { margin: 0; padding-left: 22px; }
.parecer li { margin: 6px 0; }
.parecer ol > li { margin: 12px 0; }
.parecer .c { font-weight: 700; color: var(--sistema); }
.parecer blockquote { display: none; }
.parecer table { display: none; }
.bloqueado { padding: 22px 32px; border-top: 1.5px dashed var(--drop-pauta); color: var(--tinta-2); font-size: 14px; display: flex; gap: 12px; align-items: center; }
.cadeado { width: 16px; height: 18px; flex: none; }

/* grade de correção */
.grade { background: var(--papel); border: 1.5px solid var(--drop); border-radius: 8px; }
/* quando a grade nao cabe na tela ela rola junto com a pagina, sem barra de rolagem escondida */
.certeza { margin-top: 14px; padding: 14px; background: var(--amarelo-claro); border-radius: 4px; }
.certeza p { margin: 0 0 12px; font-size: 14px; }
.grade-cab { padding: 14px 18px 12px; border-bottom: 1.5px solid var(--drop); }
.grade-cab h2 { margin: 2px 0 0; font-size: 16.5px; }
.grade-cab p { margin: 4px 0 0; font-size: 12.5px; color: var(--tinta-2); }
.grade-corpo { padding: 6px 18px 18px; }
.etapa { padding-top: 12px; }
.etapa + .etapa { margin-top: 16px; border-top: 1.5px solid var(--drop-pauta); }

fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.comp { padding: 7px 0; border-bottom: 1px solid var(--drop-pauta); }
.comp legend { padding: 0; font-weight: 700; font-size: 14px; display: flex; gap: 8px; align-items: baseline; width: 100%; }
.comp legend .desc { font-weight: 400; font-size: 12px; color: var(--tinta-2); }
.ovais { display: flex; gap: 5px; margin-top: 5px; }
.oval { position: relative; }
.oval input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.oval span { display: grid; place-items: center; min-width: 42px; height: 26px; border: 1.5px solid var(--drop); border-radius: 50%; font-size: 12.5px; font-weight: 600; color: var(--drop-forte); font-variant-numeric: tabular-nums; background: var(--papel); }
.oval.p span { min-width: 40px; }
.oval input:hover + span { background: var(--drop-fundo); }
.oval input:checked + span { background: var(--tinta); border-color: var(--tinta); color: #fff; }
.oval input:focus-visible + span { outline: 3px solid var(--drop); outline-offset: 2px; }
.oval input:disabled { cursor: default; }
.oval input:disabled:not(:checked) + span { opacity: .35; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 4px; font-weight: 700; }
.total output { font-size: 22px; font-variant-numeric: tabular-nums; }
.total output.parcial { font-size: 13px; font-weight: 400; color: var(--tinta-2); }
.compara { margin-bottom: 10px; }

label.campo { display: block; margin-top: 14px; font-weight: 700; font-size: 14px; }
label.campo small { display: block; font-weight: 400; font-size: 12px; color: var(--tinta-2); margin-top: 2px; }
textarea { width: 100%; margin-top: 6px; min-height: 104px; padding: 10px 12px; border: 1.5px solid #b9c7be; border-radius: 6px; background: #fff; font: 14px/1.5 var(--ui); resize: vertical; }
textarea:focus { border-color: var(--drop); outline: none; box-shadow: 0 0 0 3px var(--drop-pauta); }
textarea:disabled { background: var(--sistema-fundo); border-color: var(--drop-pauta); }
.falta { color: var(--erro); font-size: 13px; margin: 10px 0 0; }
.registro { margin-top: 12px; padding: 10px 12px; border: 1.5px solid var(--drop); border-radius: 6px; font-size: 13px; color: var(--drop-forte); background: var(--drop-fundo); }

.compara { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; font-size: 13.5px; }
.compara th, .compara td { padding: 5px 6px; text-align: center; border-bottom: 1px solid var(--drop-pauta); }
.compara th:first-child, .compara td:first-child { text-align: left; }
.compara .sis { color: var(--sistema); font-weight: 700; }

.crit { padding: 11px 0; border-bottom: 1px solid var(--drop-pauta); }
.crit legend { font-weight: 700; font-size: 14px; padding: 0; }
.crit .perg { font-size: 12.5px; color: var(--tinta-2); margin: 2px 0 0; }
.escala { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 12px; color: var(--tinta-2); margin-top: 6px; }
.escala span:last-child { text-align: right; }
.navega { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }

/* telas cheias: boas-vindas, tutorial, final */
.tela { max-width: 780px; margin: 28px auto 60px; background: var(--papel); border: 1px solid #d6d6d2; border-radius: 4px; padding: 40px 52px 44px; box-shadow: 0 1px 2px rgba(20,30,25,.06), 0 6px 20px rgba(20,30,25,.06); }
.tela h1 { font-size: 27.5px; margin: 4px 0 12px; letter-spacing: -.01em; }
.tela h2 { font-size: 19.5px; font-weight: 600; margin: 38px 0 6px; padding-top: 0; }
.tela p, .tela li { font-size: 15px; line-height: 1.6; }
.tela ol.passos, .tela ol.regras { padding: 0; margin: 8px 0 0; list-style: none; counter-reset: p; }
.tela ol.passos > li, .tela ol.regras > li { counter-increment: p; display: grid; grid-template-columns: 56px 1fr; column-gap: 8px; padding: 16px 0; border-top: 1px solid var(--drop-pauta); margin: 0; }
.tela ol.passos > li::before, .tela ol.regras > li::before { content: counter(p); grid-row: 1 / span 2; font: 400 31.5px/1 var(--marca); color: var(--k40); font-variant-numeric: tabular-nums; }
.tela ol.regras > li::before { font-size: 20px; padding-top: 2px; }
.tela h3 { grid-column: 2; margin: 0 0 4px; font: 600 15.5px/1.35 var(--marca); }
.tela li p { grid-column: 2; margin: 0; }
.amostra { display: inline-block; font: 600 12.5px/1 var(--marca); padding: 5px 9px; border-radius: 4px; border: 1.5px solid var(--tinta); background: var(--papel); white-space: nowrap; vertical-align: 1px; }
.amostra.cheia { background: var(--amarelo); border-color: var(--amarelo); }
mark { background: var(--amarelo-claro); color: inherit; padding: 1px 3px; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.tela .abre { font-size: 16.5px; line-height: 1.6; max-width: 60ch; }
.nome { display: flex; gap: 10px; margin-top: 8px; }
.nome input { flex: 1; padding: 11px 14px; font-size: 15.5px; border: 1.5px solid #b9c7be; border-radius: 6px; background: #fff; }
.nome input:focus { border-color: var(--drop); outline: none; box-shadow: 0 0 0 3px var(--drop-pauta); }
.pe { font-size: 13px; color: var(--tinta-2); }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

<section class="tela">
  <h1>Como funciona esta avaliação</h1>
  <p class="abre">Você vai corrigir <span id="t-n"></span> redações do ENEM e, depois de cada uma, dizer o que achou da correção feita por um sistema automático. Dá para parar quando quiser e continuar outro dia.</p>

  <h2>Em cada redação</h2>
  <ol class="passos">
    <li><h3>Leia e dê a sua nota</h3><p>Marque uma nota por competência, de C1 a C5, como na banca do ENEM. Depois anote, em poucas palavras, os dois ou três problemas principais que você apontaria ao estudante. As linhas da redação são numeradas, então você pode escrever algo como "linha 7". A redação e a grade de notas rolam separadas: para descer em uma delas, deixe o mouse em cima dela e use a rodinha.</p></li>
    <li><h3>Confirme</h3><p>Clique em <span class="amostra cheia">Confirmar minha nota e ver o sistema</span>. A página pede para você confirmar mais uma vez. Daí em diante a nota daquela redação <mark>não pode mais ser mudada</mark>. É de propósito: queremos a sua leitura antes de você ver a do sistema.</p></li>
    <li><h3>Avalie o sistema</h3><p>Aparecem a nota e o comentário que o sistema escreveu para o estudante. Dê de 1 a 5 em quatro pontos: se o comentário é específico, se ajuda o estudante, se está correto e se combina com a nota.</p></li>
    <li><h3>Siga para a próxima</h3><p>A coluna da esquerda mostra o que já foi feito e o que falta. Cada redação leva de 10 a 12 minutos.</p></li>
  </ol>

  <h2>Para não perder nada</h2>
  <p>O que você marca fica guardado sozinho neste navegador, neste computador. Fechar a página ou desligar o computador não apaga nada.</p>
  <ol class="regras">
    <li><h3>Abra sempre do mesmo jeito</h3><p>Salve o arquivo no computador e abra com dois cliques, sempre pelo mesmo navegador. Não abra pela pré-visualização do e-mail ou do WhatsApp, nem em janela anônima.</p></li>
    <li><h3>Guarde uma cópia ao fim do dia</h3><p>Clique em <span class="amostra">Baixar respostas</span>, no alto da página. Se precisar trocar de computador, leve esse arquivo e use <span class="amostra">Carregar respostas</span>.</p></li>
    <li><h3>Não limpe o histórico até terminar</h3><p>Limpar os dados de navegação apaga o progresso que não estiver numa cópia.</p></li>

<script type="application/json" id="dados">[{"cod": "F01", "tema": "O Brasil paralisado: o que você pensa sobre a greve dos caminhoneiros?", "titulo": "O transporte que paralisou o Brasil", "motivadores": "<p>Nas últimas semanas de maio, uma paralisação dos caminhoneiros se tornou o centro da atenção de todo o país, tanto pelos bloqueios das principais rodovias nacionais e estaduais, quanto por sua consequência mais grave: o desabastecimento, isto é, a falta de produtos que interferem diretamente no cotidiano de todos, como alimentos, combustíveis e remédios. No momento em que esta proposta é formulada (29/05), ainda não se conhece o fim da crise, nem se sabe se ela terminará em breve ou entrará pelo mês de junho. Não importa. O que conta é que a paralisação tem dividido opiniões, dentro e fora do governo, dos partidos políticos, dos movimentos sociais. Como você se coloca diante dessa polêmica? Acha que os caminhoneiros têm razão de parar e fazer suas reivindicações? Crê que o Brasil não pode ficar refém de uma categoria profissional e que os grevistas exageram? Pensa que a questão deve ser examinada pelo ponto de vista daqueles que reivindicam, mas também pelo daqueles que acabam pagando o preço da greve, isto é, da maioria de nossa população? Ou ainda considera que há outros fatores a serem analisados para se refletir sobre o problema. Redija uma dissertação argumentativa, apresentando e defendendo seu ponto de vista sobre esse momento crítico da vida nacional.<\/p><p><\/p><p>Linhas de ônibus suspensas no Rio de Janeiro, ameaça de falta de querosene de aviação em aeroportos de cinco capitais, falta de combustíveis em postos de todo o país, possibilidade de caos no transporte público de São Paulo. Efeitos como esses estão sendo sentidos em todo o país. Nos primeiros dias, o Governo federal tentou diminuir os efeitos da crise, mas logo viu que isso era impossível e não demorou a negociar com os caminhoneiros e ceder às suas reivindicações. Isso, contudo, não significou o fim da paralisação.<\/p><p>Uma das dificuldades é que não existe uma organização que possa ser apontada como líder da paralisação. A proposta de greve começou a circular de forma espontânea em redes sociais e grupos de WhatsApp de caminhoneiros. Uma das principais entidades envolvidas é a Confederação Nacional dos Transportadores Autônomos, que congrega a maioria dos sindicatos de motoristas autônomos. Outros sindicatos da categoria se juntaram ao movimento, assim como os motoristas de frota, os contratados com carteira assinada por transportadoras.<\/p><p>A principal exigência dos grevistas é a queda no preço do óleo diesel, cujo custo atual, segundo os representantes dos motoristas, torna inviável o transporte de mercadorias no país. De fato, houve momentos em que o preço do diesel subiu diariamente, invalidando qualquer estimativa de preço dos fretes. Para resolver essa questão o governo anunciou um corte de impostos, o que aumenta a dívida pública (isto é, do próprio governo). Outra saída seria mudar a política de preços da Petrobrás, o que colocaria em riscos as contas da companhia.<\/p><p>Como disse a Folha de S. Paulo, em editorial, “Governantes e legisladores seguem aferrados à prática de acomodar todas as demandas de uma sociedade desigual no Orçamento e na dívida pública, como se já não vivêssemos as tristes sequelas do esgotamento dessa estratégia”. Já o Estado de S. Paulo, outro importante jornal da capital paulista, também critica o governo pelo mesmo motivo, bem como acusa de irresponsabilidade os políticos que pegam carona na crise para promover seus próprios interesses e ainda os caminhoneiros, “pois nenhuma reivindicação é justa o bastante para legitimar essa agressão (a greve) contra todos os brasileiros”.<\/p><p>De qualquer modo, uma pesquisa Datafolha revela que 87% da população brasileira apoiam o movimento.<\/p><p>[Do Banco de Redações, com textos editados da BBC Brasil e dos jornais Folha de S. Paulo e Estado de S. Paulo]<\/p>", "paragr os consumidores.<\/li>\n<li><span class=c>C3:<\/span> A argumentação está confusa e pouco organizada; há repetição de ideias e falta de clareza sobre quem deve reduzir o valor e como isso beneficia os caminhoneiros, comprometendo a defesa do ponto de vista.<br><i>Sugestão:<\/i> O governo deve reduzir os preços dos combustíveis, pois isso facilita o acesso dos caminhoneiros aos insumos necessários para as entregas, beneficiando toda a população.<\/li>\n<li><span class=c>C4:<\/span> A sequência de conectivos está confusa; há repetição de ideias e falta de clareza na relação entre as orações, o que impede a articulação fluida entre os parágrafos.<br><i>Sugestão:<\/i> A nação deve considerar a redução dos custos de combustível, pois isso facilitaria o acesso dos caminhoneiros aos preços mais baixos.<\/li>\n<li><span class=c>C5:<\/span> A proposta de intervenção está vaga e incompleta: não há agente claro (quem deve agir), nem ação específica, nem modo/meio de implementação, nem efeito esperado. Além disso, a ideia de &quot;diminuir o valor&quot; não está articulada com políticas públicas viáveis.<br><i>Sugestão:<\/i> O governo federal, por meio do Ministério de Minas e Energia, deve criar um programa de subsídio ao combustível para o transporte de cargas, reduzindo em 15% o preço da gasolina e do diesel nas rodovias nacionais. Essa medida será financiada com recursos do Fundo de Desenvolvimento da Infraestrutura e terá como efeito a diminuição dos custos operacionais dos caminhoneiros, garantindo a regularidade no abastecimento de alimentos e combustíveis ao país.<\/li>\n<\/ul><\/li>\n<\/ol><h3>Como melhorar<\/h3><ul>\n<li><span class=c>C1:<\/span> Revisar as regras de concordância verbal e nominal, praticando exercícios que reforcem a relação entre sujeito e verbo.<\/li>\n<li><span class=c>C1:<\/span> Estudar a pontuação normativa (uso correto de vírgulas, ponto e vírgula) e aplicar em reescritas de frases curtas antes de iniciar o texto final.<\/li>\n<li><span class=c>C1:<\/span> Ler textos dissertativos de boa qualidade e analisar a escolha de registro formal, reproduzindo estruturas semelhantes em suas próprias produções.<\/li>\n<li><span class=c>C2:<\/span> Planeje a redação antes de escrever: delimite a tese, organize dois a três argumentos consistentes e finalize com uma proposta de intervenção bem estruturada.<\/li>\n<li><span class=c>C2:<\/span> Use exemplos concretos e dados (mesmo que genéricos) para sustentar seus argumentos, demonstrando domínio do tema e capacidade de argumentação.<\/li>\n<li><span class=c>C2:<\/span> Conclua de forma clara, retomando a tese e apresentando uma solução viável, detalhando quem deve agir, o que fazer e como será implementado.<\/li>\n<li><span class=c>C3:<\/span> Planeje a estrutura do texto antes de escrever: introdução, desenvolvimento com argumentos claros e conclusão que retome o ponto de vista.<\/li>\n<li><span class=c>C3:<\/span> Use conectivos lógicos (por exemplo, &quot;além disso&quot;, &quot;consequentemente&quot;, &quot;por isso&quot;) para garantir a coesão entre as ideias e evitar saltos abruptos.<\/li>\n<li><span class=c>C3:<\/span> Selecione apenas os fatos e argumentos mais relevantes dos textos motivadores e desenvolva-os de forma aprofundada, evitando informações superficiais ou contraditórias.<\/li>\n<li><span class=c>C4:<\/span> Estude e pratique o uso de conectivos adequados (por exemplo, &quot;além disso&quot;, &quot;consequentemente&quot;, &quot;por outro lado&quot;) para garantir relações claras entre as ideias.<\/li>\n<li><span class=c>C4:<\/span> Faça revisões focadas na referência dos pronomes e termos substitutivos, assegurando que cada pronome tenha um antecedente explícito e próximo.<\/li>\n<li><span class=c>C4:<\/span> Organize o texto em blocos temáticos bem delimitados e use conectivos de transição entre parágrafos para melhorar a fluidez e a coesão global.<\/li>\n<li><span class=c>C5:<\/span> Defina claramente o agente responsável (ex.: governo federal, ficadora do crime de homicídio. [UOL] Leia o texto na íntegra \n \n<\/p>", "paragrafos": ["O feminicídio existe no Brasil e o debate sobre essa questão é fundamental. Assim, a violência contra a mulher choca a sociedade brasileira seja por revelar um machismo enraizado nela, e ao mesmo tempo, inferir os direitos humanos. Nesse contexto, é necessário um olha mais atentpara esse debate, considerando a sua importância a promoção de uma sociedade mais crítica e reflexiva. Por consequência, ela tende a ser mais justa, igualitária e humanizada.", "Em primeira análise, no Brasil, o feminicídio tem muito a ser discutido. Isso porque as suas motivações, que levam ao assassinato de uma mulher, se justificam pela própria condição de gênero da vítima. Diante disso, a sociedade induz o machismo construído ao decorrer da história levando , muitas vezes, a mulher aceitar seu lugar de submissão. Em casos mais radicais de violência doméstica, elas não denunciam seu agressores . Tais posturas, portanto, constrangem a nação e retrocedem às épocas remotas quando a mulher era vista mais como um objeto na palma da mão de seu ''dono''.", "Na mesma perspectiva, o essa forma descomunal de homicídio revela que em se tratando da dignidade humana, voltado ao gênero feminino, não vem sendo respeitada . Para ilustrar essa realidade, a Organização Mundial da Saúde (OMS) levantou dados à respeito do Brasil. Chegou-se à conclusão que o país é o quinto d mundo a apresentar taxa de feminicídio, atingindo uma marca de 4,8 para 100 mil mulheres. Logo, a Legislação seria um importante regulador dessa condição indigna do ser humano, já que se pode mostrar aos cidadãos, principalmente do gênero masculino, que esse desrespeito não pode ser abarcado; fazendo com que às leis sejam uma ponte para alcançar uma sociedade humanizada.", "Torna-se evidente, contudo, que medidas do Governo, das escolas e dos professores, devem ser estabelecidas para que o cenário do feminicídio mude, no Brasil. O Governo, por meio do Ministério da Educação e inclusão, deve incitar na sociedade moderna o debate, por meio de propagandas em veículos de disseminação em massa com o enfoque nas mulheres, salientando que esta parcela da sociedade deve ser amparada e respeitada. Além disso, cabe as escolas e professores, com suas oficinas com a temática ''Debate a violência contra a mulher'', mostrar aos alunos a extrema importância dessa argumentação para a construção de um ambiente escolar tanto democrático, quanto solidário. Só assim, o feminicídio deixará de ser uma das misérias atuais."], "sistema": {"C1": 120, "C2": 160, "C3": 120, "C4": 160, "C5": 120}, "feedback": "<h3>Pontos fortes<\/h3><ul>\n<li><span class=c>C1:<\/span> Apresentou um repertório relevante ao citar dados da OMS e ao mencionar a legislação como instrumento de mudança.<\/li>\n<li><span class=c>C1:<\/span> Estruturou o texto em introdução, desenvolvimento e conclusão, demonstrando organização de ideias.<\/li>\n<li><span class=c>C2:<\/span> Você compreendeu a proposta e manteve o foco no tema proposto, desenvolvendo argumentos que se relacionam diretamente com o feminicídio no Brasil.<\/li>\n<li><span class=c>C2:<\/span> A estrutura geral (introdução, desenvolvimento e conclusão) está presente e demonstra clareza na proposição de solução.<\/li>\n<li><span class=c>C3:<\/span> Você trouxe dados da OMS que dão credibilidade ao seu argumento e demonstra capacidade de selecionar informações relevantes ao tema.<\/li>\n<li><span class=c>C3:<\/span> O texto apresenta uma proposta de intervenção (ações do Governo, escolas e professores), atendendo ao requisito de defesa de um ponto de vista.<\/li>\n<li><span class=c>C4:<\/span> Você utiliza conectivos que garantem a continuidade entre as ideias, como &quot;Assim&quot;, &quot;Por consequência&quot; e &quot;Além disso&quot;, o que impede que o texto se torne fragmentado.<\/li>\n<li><span class=c>C4:<\/span> Há variedade de recursos de coesão referencial (pronomes demonstrativos, possessivos e relativos) que ajudam a manter a referência ao tema ao longo do texto.<\/li>\n<li><span class=c>C5:<\/span> Você conseguiu relacionar a proposta de intervenção ao tema central, mostrando que o governo, escolas e professores têm papéis importantes no combate ao feminicídio.<\/li>\n<li><span class=c>C5:<\/span> A proposta está inserida no contexto da discussão desenvolvida no texto, citando a necessidade de debate e de oficinas nas escolas.<\/li>\n<\/ul><h3>O que corrigir, trecho a trecho<\/h3><ol>\n<li>&ldquo;um olha mais atentpara esse debate&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de ortografia e concordância: a palavra correta é &quot;olho&quot; (substantivo) ou &quot;olhar&quot; (verbo), e a expressão &quot;mais atento&quot; deve concordar em gênero e número com o substantivo ao qual se refere. Além disso, falta espaço entre &quot;atent&quot; e &quot;para&quot;.<br><i>Sugestão:<\/i> um olhar mais atento para esse debate<\/li>\n<\/ul><\/li>\n<li>&ldquo;Em primeira análise, no Brasil, o feminicídio tem muito a ser discutido.&rdquo;<ul>\n<li><span class=c>C3:<\/span> A frase não estabelece claramente a relação entre a informação apresentada e o ponto de vista defendido; falta aprofundamento e conexão lógica com os argumentos posteriores, o que compromete a organização e a coesão das ideias.<br><i>Sugestão:<\/i> Em primeira análise, constata‑se que o feminicídio no Brasil exige um debate aprofundado, pois suas causas estruturais revelam a persistência de desigualdades de gênero.<\/li>\n<\/ul><\/li>\n<li>&ldquo;a sociedade induz o machismo construído ao decorrer da história levando , muitas vezes, a mulher aceitar seu lugar de submissão&rdquo;<ul>\n<li><span class=c>C1:<\/span> Problemas de regência e pontuação: o verbo &quot;induz&quot; exige objeto direto, não &quot;o machismo&quot;; a vírgula está deslocada antes de &quot;muitas vezes&quot;; falta concordância em &quot;levando&quot; que deveria estar ligado ao sujeito da oração.<br><i>Sugestão:<\/i> a sociedade perpetua o machismo construído ao longo da história, levando, muitas vezes, a mulher a aceitar seu lugar de submissão<\/li>\n<\/ul><\/li>\n<li>&ldquo;não vem sendo respeitada .&rdquo;<ul>\n<li><span class=c>C1:<\/span> Uso incorreto de espaço antes do ponto final e construção verbal inadequada; o verbo deve concordar com o sujeito &quot;dignidade humana&quot; (singular).<br><i>Sugestão:<\/i> não vem sendo respeitada.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Logo, a Legislação seria um importante regulador dessa condição indigna do ser humano, já que se pode mostrar aos cidadãos, principalmente do gênero masculino, que esse desrespeito não pode ser abarcado;&rdquo;<ul>\n<li><span class=c>C3:<\/span> O trecho apresenta uma sequência de ideias desconexa e pouco desenvolvida, dificultando a compreensão da proposta de intervenção e enfraquecendo a defesa do ponto de vista.<br><i>Sugestão:<\/i> Portanto, a legislação deve atuar como regulador dessa condição indigna, ao estabelecer penas mais rigorosas e campanhas de conscientização que mostrem a todos, especialmente aos homens, que o desrespeito à vida das mulheres não será tolerado.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Torna-se evidente, contudo, que medidas do Governo, das escolas e dos professores, devem ser estabelecidas para que o cenário do feminicídio mude, no Brasil.&rdquo;<ul>\n<li><span class=c>C2:<\/span> O trecho apresenta uma sequência de ideias desconexa e pouco aprofundada, o que impede a construção de uma argumentação consistente e bem fundamentada, exigida para o nível máximo da competência C2.<br><i>Sugestão:<\/i> Torna-se evidente, contudo, que medidas concretas do governo, das escolas e dos professores devem ser implementadas, como políticas públicas de prevenção, capacitação de agentes de segurança e programas educativos nas escolas, para efetivamente reduzir o feminicídio no Brasil.<\/li>\n<li><span class=c>C4:<\/span> O uso de &quot;contudo&quot; como conectivo adversativo não está adequado ao sentido da frase, que apresenta uma ideia de continuidade e não de contraste. Isso gera uma quebra na coerência da articulação entre os parágrafos.<br><i>Sugestão:<\/i> Torna-se evidente, portanto, que medidas do Governo, das escolas e dos professores, devem ser estabelecidas para que o cenário do feminicídio mude no Brasil.<\/li>\n<\/ul><\/li>\n<li>&ldquo;O Governo, por meio do Ministério da Educação e inclusão, deve incitar na sociedade moderna o debate, por meio de propagandas em veículos de disseminação em massa com o enfoque nas mulheres, salientando que esta parcela da sociedade deve ser amparada e respeitada.&rdquo;<ul>\n<li><span class=c>C5:<\/span> A proposta não especifica claramente o agente responsável (ex.: Ministério da Educação em parceria com o Ministério da Mulher, Família e Direitos Humanos), nem descreve o modo/meio (campanha publicitária nas TV, rádio e internet) e o efeito esperado (aumento da conscientização e redução dos casos de feminicídio). Falta detalhar a ação concreta e mensurável.<br><i>Sugestão:<\/i> O Governo, por meio do Ministério da Educação em parceria com o Ministério da Mulher, Família e Direitos Humanos, deve lançar uma campanha nacional de conscientização sobre o feminicídio, veiculada em TV, rádio e redes sociais, com o objetivo de informar a população sobre os direitos das mulheres e incentivar a denúncia de violência, contribuindo para a redução dos casos.<\/li>\n<\/ul><\/li>\n<li>&ldquo;cabe as escolas e professores, com suas oficinas com a temática &#x27;&#x27;Debate a violência contra a mulher&#x27;&#x27;, mostrar aos alunos a extrema importância dessa argumentação para a construção de um ambiente escolar tanto democrático, quanto solidário.&rdquo;<ul>\n<li><span class=c>C5:<\/span> A proposta não indica quem será o agente executor (escolas públicas e privadas), nem o modo de implementação (carga horária, material didático) e o efeito esperado (mudança de atitude dos estudantes). Falta detalhar a ação e o resultado pretendido.<br><i>Sugestão:<\/i> As escolas públicas e privadas, com apoio dos professores, devem incluir, obrigatoriamente, oficinas mensais sobre violência contra a mulher, com carga horária de duas horas, utilizando materiais didáticos produzidos pelo Ministério da Educação, para promover a reflexão crítica dos alunos e gerar um ambiente escolar mais democrático e solidário, reduzindo a tolerância à violência de gênero.<\/li>\n<\/ul><\/li>\n<\/ol><h3>Como melhorar<\/h3><ul>\n<li><span class=c>C1:<\/span> Revisar a ortografia e a concordância verbal e nominal em todas as frases, usando ferramentas de correção ou leitura em voz alta.<\/li>\n<li><span class=c>C1:<\/span> Estudar as regras de regência verbal e nominal, bem como o uso correto da pontuação, especialmente a colocação de vírgulas e pontos.<\/li>\n<li><span class=c>C1:<\/span> Praticar a escrita de textos formais, focando na escolha de registro adequado e na coerência gramatical, e solicitar revisão de um professor ou colega antes da entrega.<\/li>\n<li><span class=c>C2:<\/span> Enriqueça seus argumentos com repertório sociocultural relevante (dados de pesquisas, leis, casos emblemáticos) que sustentem suas propostas.<\/li>\n<li><span class=c>C2:<\/span> Desenvolva cada proposta de intervenção de forma detalhada, indicando agente responsável, ação específica, meio de implementação e avaliação de resultados.<\/li>\n<li><span class=c>C2:<\/span> Garanta a coesão entre os parágrafos, conectando ideias de forma lógica e progressiva, para que a argumentação flua de maneira mais persuasiva.<\/li>\n<li><span class=c>C3:<\/span> Estruture o texto em blocos claros: introdução (apresentação do tema e tese), desenvolvimento (argumentos com dados, exemplos e análise) e conclusão (reafirmação da tese e proposta de intervenção).<\/li>\n<li><span class=c>C3:<\/span> Aprofunde cada argumento, explicando como as informações selecionadas sustentam seu ponto de vista e criando ligações explícitas entre eles (uso de conectivos de causa, consequência e contraste).<\/li>\n<li><span class=c>C3:<\/span> Ao propor soluções, detalhe quem será responsável, como será implementada e quais resultados espera alcançar, demonstrando autoria e coerência na defesa do ponto de vista.<\/li>\n<li><span class=c>C4:<\/span> Revise a escolha dos conectivos, garantindo que o tipo (adversativo, conclusivo, explicativo, etc.) corresponda ao sentido lógico que você pretende estabelecer entre as orações e os parágrafos.<\/li>\n<li><span class=c>C4:<\/span> Varie ainda mais os recursos de coesão referencial, usando pronomes relativos e advérbios de tempo ou causa (por exemplo, &quot;conforme&quot;, &quot;de acordo com&quot;, &quot;assim que&quot;) para evitar repetições e reforçar a ligação entre as ideias.<\/li>\n<li><span class=c>C4:<\/span> Planeje a estrutura do texto antes de escrever, definindo claramente a sequência de argumentos e os conectivos que irão guiar o leitor de um ponto ao outro, assegurando uma progressão lógica e fluida.<\/li>\n<li><span class=c>C5:<\/span> Defina claramente o agente responsável por cada ação da proposta (ex.: ministérios, escolas, ONGs).<\/li>\n<li><span class=c>C5:<\/span> Descreva o modo/meio de execução (campanhas, oficinas, materiais didáticos, parcerias) e indique o efeito esperado de forma concreta e mensurável.<\/li>\n<li><span class=c>C5:<\/span> Estruture a proposta em sequência lógica: agente → ação → modo/meio → efeito, garantindo que cada elemento esteja presente e bem detalhado.<\/li>\n<\/ul>"}, {"cod": "F03", "tema": "Parto humanizado: uma questão de saúde pública", "titulo": "Parto humanizado", "motivadores": "<p>Texto 1: Em meados dos anos 2000, alguns movimentos contrários à hospitalização do parto começaram a crescer no Brasil, questionando nossas altas taxas de cesáreas e excessivas intervenções nos partos, solicitando mais autonomia da paciente. Foi neste momento que o movimento do parto humanizado começou a crescer.<\/p><p>O parto humanizado é condição que respeita a gestante e o bebê, permite que sua autonomia seja levada em consideração, seja no parto vaginal, seja na cesárea, seja no fórceps. A maneira de nascimento não é o que determina essa humanização e, sim, o respeito com que a paciente é atendida.<\/p><p>Texto 2: Segurar o filho pela primeira vez é, para muitas mulheres, uma experiência única. Para tornar este momento ainda mais especial, o Hospital e Maternidade José Martiniano de Alencar (HMJMA), unidade de média complexidade da Secretaria de Saúde do Ceará (Sesa), do Governo do Estado, investe na humanização do atendimento. “As mães em trabalho de parto são nossa prioridade. Tudo é conduzido da forma mais humanizada possível”, destacou o obstetra Francisco Nogueira, coordenador da maternidade no HMJMA.<\/p><p>Texto 3: Segundo o Comitê, o parto humanizado deve ser realizado em um hospital, local mais adequado e seguro para mãe e para o bebê. “As complicações ocorrem em cerca de 10% dos casos. Entre eles estão: sangramento, elevação da pressão arterial materna, sofrimento fetal agudo e prolapso do cordão umbilical. Estas situações necessitam de atendimento médico imediato e local para tratamento apropriado da mãe e do bebê”, explica a médica obstétrica Dra. Dani WerKa.<\/p><p>Texto 4: O Brasil realiza quase quatro vezes mais cesáreas do que os 15% considerados aceitáveis pela Organização Mundial da Saúde (OMS). Por outro lado, faltam casas de parto normal no Sistema Único de Saúde (SUS). Em todo o território nacional, existem apenas 18 delas em funcionamento.<\/p><p>Mas que esses dados significam? Por que há tão poucas casas de parto no Brasil? Uma conclusão não totalmente óbvia: esse descaso demonstra que a política pública brasileira para maternidade se coloca não apenas a favor de procedimentos invasivos como contra a autonomia da mulher.<\/p>", "paragrafos": ["O nascimento é um acontecimento singular da vida; um momento em que ocorre a aproximação de uma mãe e de seu recém-nascido através do compartilhamento de emoções afetivas entre ambos. Isto posto, compele fazer-se um questionamento: a priorização de um método de parto em que essas interações ocorram - em detrimento a outros métodos menos humanizados -, não é uma questão de saúde pública?", "Quando analisa-se nacionalmente esta questão, observa-se que o Brasil está longe de ser o exemplo ideal com relação implementação deste método à saúde pública. Dados demonstram que há falta de unidades especializadas neste tipo de procedimento, bem como há falta de interesse do Poder Público de introdução destas mesmas ao Sistema Único de Saúde.", "O baixo envolvimento das autoridades políticas e sanitárias neste tema demonstra, para além disto, um desatino social entre as atribuições do Poder Público e os direitos individuais da mulher, resultando no desestímulo do aperfeiçoamento e da implementação deste método.", "É mister enfatizar, portanto, que mais do que nunca faz-se necessária a participação popular na requisição e na cobrança da implementação bem como no aperfeiçoamento deste método pelo Poder Público, haja vista que esta é uma questão pública, que embasada em diversos apontamentos técnico-científicos, demonstram ser benéfica a sua implementação em procedência à saúde da mulher. De igual modo, compete a este, o Poder Público, visar e empenhar suas ações nas necessidades requeridas pela sociedade, tal como delimitado essencialmente em suas atribuições basilares. Por fim, a incrementação deste método resultará, sem sombra de dúvidas, no aprimoramento da saúde pública no Brasil, bem como, para fins sociais, no aprimoramento dos direitos individuais da mulher."], "sistema": {"C1": 160, "C2": 160, "C3": 120, "C4": 120, "C5": 120}, "feedback": "<h3>Pontos fortes<\/h3><ul>\n<li><span class=c>C1:<\/span> Você demonstra boa capacidade de articular ideias e de usar vocabulário adequado ao tema, o que garante coesão e clareza ao texto.<\/li>\n<li><span class=c>C1:<\/span> A estrutura do parágrafo introdutório é bem elaborada, apresentando o tema e a tese de forma direta e pertinente.<\/li>\n<li><span class=c>C2:<\/span> Você compreendeu a proposta e manteve o foco no tema &quot;parto humanizado&quot; ao longo de todo o texto, sem fugir para assuntos alheios.<\/li>\n<li><span class=c>C2:<\/span> A estrutura dissertativo‑argumentativa está presente: introdução com tese, desenvolvimento com argumentos e conclusão que retoma a proposta.<\/li>\n<li><span class=c>C3:<\/span> Apresenta dados gerais que relacionam a falta de unidades especializadas ao problema do parto humanizado, demonstrando compreensão do tema.<\/li>\n<li><span class=c>C3:<\/span> Defende um ponto de vista claro ao afirmar que a ampliação do parto humanizado é imprescindível para a saúde pública.<\/li>\n<li><span class=c>C4:<\/span> Você consegue estabelecer a relação entre a importância do parto humanizado e a saúde pública, mantendo o foco no tema ao longo do texto.<\/li>\n<li><span class=c>C4:<\/span> Há uso de conectivos de sentido geral (por exemplo, &quot;portanto&quot;, &quot;por fim&quot;) que ajudam a sinalizar a conclusão de ideias.<\/li>\n<li><span class=c>C5:<\/span> Você identificou claramente a ausência de unidades especializadas e a falta de interesse do Poder Público, demonstrando compreensão do problema central.<\/li>\n<li><span class=c>C5:<\/span> A redação apresenta uma conclusão que relaciona a ampliação do parto humanizado à melhoria da saúde pública e dos direitos das mulheres.<\/li>\n<\/ul><h3>O que corrigir, trecho a trecho<\/h3><ol>\n<li>&ldquo;compele fazer-se um questionamento&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de ortografia e de regência verbal: o verbo correto é &quot;compete&quot; e a construção &quot;fazer-se um questionamento&quot; é inadequada; o verbo &quot;fazer&quot; não requer pronome reflexivo nesse contexto.<br><i>Sugestão:<\/i> compete fazer um questionamento<\/li>\n<\/ul><\/li>\n<li>&ldquo;em detrimento a outros métodos menos humanizados&rdquo;<ul>\n<li><span class=c>C1:<\/span> Preposição incorreta: a locução correta é &quot;em detrimento de&quot;.<br><i>Sugestão:<\/i> em detrimento de outros métodos menos humanizados<\/li>\n<\/ul><\/li>\n<li>&ldquo;Quando analisa-se nacionalmente esta questão, observa-se que o Brasil está longe de ser o exemplo ideal com relação implementação deste método à saúde pública.&rdquo;<ul>\n<li><span class=c>C3:<\/span> A informação é apresentada de forma genérica e não é sustentada por dados ou exemplos concretos, o que enfraquece a argumentação e a capacidade de defender o ponto de vista de maneira convincente.<br><i>Sugestão:<\/i> Ao analisar a situação nacional, constata‑se que o Brasil ainda não é referência na implementação do parto humanizado, devido à escassez de unidades especializadas e à ausência de políticas públicas específicas.<\/li>\n<\/ul><\/li>\n<li>&ldquo;há falta de interesse do Poder Público de introdução destas mesmas ao Sistema Único de Saúde&rdquo;<ul>\n<li><span class=c>C1:<\/span> Regência verbal inadequada: o verbo &quot;interesse&quot; exige a preposição &quot;na&quot; ou &quot;pela&quot; quando se refere à introdução de algo.<br><i>Sugestão:<\/i> há falta de interesse do Poder Público na introdução destas mesmas ao Sistema Único de Saúde<\/li>\n<li><span class=c>C2:<\/span> O trecho apresenta uma construção frasal confusa que impede a clareza da argumentação. A relação entre o sujeito (interesse do Poder Público) e a ação (introduzir unidades especializadas) não está bem estabelecida, o que enfraquece a coerência e a progressão lógica exigidas na competência C2.<br><i>Sugestão:<\/i> há falta de interesse do Poder Público em introduzir essas unidades ao Sistema Único de Saúde<\/li>\n<li><span class=c>C4:<\/span> A sequência de conectores está confusa; o verbo &quot;de&quot; não estabelece a relação de causa‑efeito entre a falta de interesse e a introdução. Além disso, a referência &quot;estas mesmas&quot; não está bem ancorada no texto, dificultando a coesão referencial.<br><i>Sugestão:<\/i> há falta de interesse do Poder Público na introdução dessas unidades ao Sistema Único de Saúde<\/li>\n<li><span class=c>C5:<\/span> A proposta de intervenção não especifica quem deve agir (agente), qual ação será tomada, como será feita (modo/meio), qual efeito esperado e não detalha o plano. Isso impede que a proposta seja considerada bem elaborada na competência C5.<br><i>Sugestão:<\/i> há falta de interesse do Poder Público em introduzir essas unidades no Sistema Único de Saúde.<\/li>\n<\/ul><\/li>\n<li>&ldquo;O baixo envolvimento das autoridades políticas e sanitárias neste tema demonstra, para além disto, um desatino social entre as atribuições do Poder Público e os direitos individuais da mulher, resultando no desestímulo do aperfeiçoamento e da implementação deste método.&rdquo;<ul>\n<li><span class=c>C3:<\/span> O trecho mistura diferentes argumentos (desinteresse do poder público, desatino social, direitos individuais) sem estabelecer relações claras entre eles, comprometendo a organização e a progressão lógica dos fatos e opiniões.<br><i>Sugestão:<\/i> O fraco engajamento das autoridades políticas e sanitárias evidencia um descompasso entre as responsabilidades do Poder Público e os direitos das mulheres, o que desestimula o aprimoramento e a expansão do parto humanizado.<\/li>\n<\/ul><\/li>\n<li>&ldquo;É mister enfatizar, portanto, que mais do que nunca faz-se necessária a participação popular na requisição e na cobrança da implementação bem como no aperfeiçoamento deste método pelo Poder Público, haja vista que esta é uma questão pública, que embasada em diversos apontamentos técnico-científicos, demonstram ser benéfica a sua implementação em procedência à saúde da mulher.&rdquo;<ul>\n<li><span class=c>C3:<\/span> O parágrafo apresenta uma sequência de ideias confusa e falta de coesão. Os argumentos são apresentados de forma acumulada, sem conectar claramente as informações ao ponto de vista defendido, o que impede a organização lógica exigida na competência C3.<br><i>Sugestão:<\/i> É fundamental enfatizar que a participação popular na cobrança e na exigência da implementação do parto humanizado é urgente. Essa demanda, baseada em estudos técnico‑científicos, comprova que o método traz benefícios à saúde da mulher e, consequentemente, à saúde pública.<\/li>\n<li><span class=c>C4:<\/span> O período é excessivamente longo e contém várias quebras de coesão. O uso de &quot;bem como&quot; sem pontuação adequada gera ambiguidade, e a referência &quot;esta&quot; não está claramente ligada ao antecedente &quot;questão pública&quot;. A falta de pontuação e de conectores mais precisos impede a articulação clara entre as ideias.<br><i>Sugestão:<\/i> É mister enfatizar, portanto, que mais do que nunca faz‑se necessária a participação popular na requisição e na cobrança da implementação, bem como no aperfeiçoamento deste método pelo Poder Público. Isso porque se trata de uma questão pública que, embasada em diversos apontamentos técnico‑científicos, demonstra ser benéfica à saúde da mulher.<\/li>\n<\/ul><\/li>\n<li>&ldquo;mais do que nunca faz-se necessária a participação popular na requisição e na cobrança da implementação bem como no aperfeiçoamento deste método pelo Poder Público&rdquo;<ul>\n<li><span class=c>C5:<\/span> A intervenção está descrita de forma genérica; não há definição de quem será o agente responsável (ex.: secretarias de saúde, Conselhos Municipais), nem do modo concreto de atuação (ex.: criação de campanhas, audiências públicas), nem do efeito esperado (ex.: aumento de 30% de partos humanizados em 5 anos). Falta detalhamento dos elementos essenciais da proposta.<br><i>Sugestão:<\/i> é necessária a participação popular, por meio de Conselhos Municipais de Saúde, que deverão organizar audiências públicas trimestrais para cobrar a implementação de unidades de parto humanizado, garantindo que 30% dos partos nas unidades de saúde municipais sejam realizados nesse modelo em até cinco anos.<\/li>\n<\/ul><\/li>\n<\/ol><h3>Como melhorar<\/h3><ul>\n<li><span class=c>C1:<\/span> Revisar as preposições e as regências verbais em cada frase; use gramáticas de apoio ou listas de colaboração para consolidar as combinações corretas.<\/li>\n<li><span class=c>C1:<\/span> Praticar a leitura atenta de textos acadêmicos e de exemplares de redações nota 200, focando na identificação de erros sutis de ortografia e concordância.<\/li>\n<li><span class=c>C1:<\/span> Realizar revisões finais antes de entregar a redação, preferencialmente em voz alta, para detectar construções estranhas ou desvios de registro que possam comprometer a formalidade.<\/li>\n<li><span class=c>C2:<\/span> Enriqueça seus argumentos com repertório sociocultural específico (dados de pesquisas, leis, programas governamentais ou posicionamentos de especialistas) para demonstrar maior profundidade de conhecimento.<\/li>\n<li><span class=c>C2:<\/span> Aperfeiçoe a coesão entre as ideias, usando conectivos adequados que indiquem causa, consequência e contraste, garantindo que cada parágrafo avance a argumentação de forma lógica.<\/li>\n<li><span class=c>C2:<\/span> Reformule frases que apresentem construções ambíguas ou pouco claras, garantindo que o leitor compreenda imediatamente a relação entre causa e efeito em seus argumentos.<\/li>\n<li><span class=c>C3:<\/span> Estruture o texto em parágrafos que sigam uma sequência lógica: introdução do ponto de vista, apresentação de fatos e dados concretos, desenvolvimento de argumentos com exemplos claros e conclusão que retome a tese.<\/li>\n<li><span class=c>C3:<\/span> Utilize fontes ou dados específicos (por exemplo, número de hospitais que oferecem parto humanizado ou estudos que comprovam seus benefícios) para sustentar cada argumento, evitando generalizações.<\/li>\n<li><span class=c>C3:<\/span> Faça transições explícitas entre as ideias, usando conectivos (porém, além disso, consequentemente) que mostrem a relação de causa‑efeito entre os fatos apresentados e a defesa do seu ponto de vista.<\/li>\n<li><span class=c>C4:<\/span> Varie os conectivos de coesão (por exemplo, &quot;além disso&quot;, &quot;consequentemente&quot;, &quot;por outro lado&quot;) para evitar repetições e tornar a transição entre parágrafos mais fluida.<\/li>\n<li><span class=c>C4:<\/span> Reforce a referência dos pronomes e expressões demonstrativas, garantindo que o antecedente esteja imediatamente claro para o leitor.<\/li>\n<li><span class=c>C4:<\/span> Divida períodos muito longos em sentenças menores, usando pontuação adequada e conectores que indiquem a relação lógica (causa, consequência, adição, contraste).<\/li>\n<li><span class=c>C5:<\/span> Defina claramente o agente da intervenção (ex.: secretarias de saúde, Conselhos Municipais, Ministério da Saúde).<\/li>\n<li><span class=c>C5:<\/span> Descreva a ação concreta, o modo/meio de execução (ex.: criação de protocolos, capacitação de profissionais, campanhas de informação) e indique o efeito esperado com um objetivo mensurável.<\/li>\n<li><span class=c>C5:<\/span> Integre a proposta ao restante do texto, retomando os argumentos desenvolvidos e mostrando como a intervenção resolve os problemas apontados.<\/li>\n<\/ul>"}, {"cod": "F04", "tema": "Desafios na Educação a Distância no Brasil", "titulo": "A Consequência para a Educação a Distância no Panorama Atual.", "motivadores": "<p>Educação a distância é a modalidade educacional na qual alunos e professores estão separados, física ou temporalmente e, por isso, faz-se necessária a utilização de meios e tecnologias de informação e comunicação. Essa modalidade é regulada por uma legislação específica e pode ser implantada na educação básica (educação de jovens e adultos, educação profissional técnica de nível médio) e na educação superior. [MEC] Leia o texto na íntegra \nAdotado em larga escala na pandemia - que exige o isolamento social, o ensino à distância mudou a rotina de muita gente. No Pará, cerca de 800 mil estudantes buscam manter os estudos e lidam com impactos das aulas remotas, que vão desde a dificuldade de adaptação à mudança do esquema escolar, ao não acesso a equipamentos básicos para o estudo em casa, além de enfrentar questões como a ansiedade e insegurança provocadas pela circunstância de proliferação do vírus que já matou quase 4 mil pessoas no estado. [G1] Leia o texto na íntegra\nDe todas as áreas impactadas pela pandemia de coronavírus, poucas foram tão profundamente afetadas como a educação. 48,5 milhões é o número de alunos que cursam a educação básica no Brasil e que não estão frequentando as aulas presencialmente em atendimento às medidas de distanciamento social. Segundo estimativas da Unicef, mais de 95% das crianças estão fora da escola na América Latina e no Caribe. O número equivale a 1,5 bilhão de estudantes.\n\nPara além dos evidentes impactos que esse evento sem precedentes pode ter para o aprendizado, há outros efeitos que surgem com a não frequência à escola, já que ela é fundamental para os estudantes em outros aspectos como, por exemplo, para apoio psicológico e atividades extracurriculares. Além disso, nunca custa lembrar que a escola é, para muitas crianças e jovens, a principal fonte de alimentação – daí a importância de políticas como a merenda escolar. [UOL] Leia o texto na íntegra<\/p>", "paragrafos": ["A educação sempre foi um tema polêmico dentro do país, mas hodiernamente tem se falado muito mais sobre a situação dela após as medidas tomadas durante a pandemia d covid-19. O distanciamento social, medida essencial para evitar o contágio, fez com que todas as escolas e faculdades parassem com suas atividades, o que provocou um grande problema em relação aos estudos de crianças e jovens brasileiros. Além de mudar drasticamente a rotina da maioria dos estudantes.", "Com essa pausa, muitos riscos a saúde deles foram abolidos . Porém, vários problemas vieram à tona. O distanciamento fez com que crianças e jovens ficassem atrasados nos seus estudos, algo que trás muitos desafios para a educação. Uma das soluções utilizadas pelos alunos foi optar pela educação a distância, modalidade educacional na qual alunos e professores estão separados, física ou temporalmente.", "Para essa saída, obrigatoriamente, o aluno precisa de tecnologia e meio de comunicação. Existem muitas plataformas digitais de estudo gratuitas, porém, o grande problema é que nem todos possuem a mesma condição financeira para cobrir os custos devido a esse tipo de educação. Além disso, vale lembrar que muitos alunos estudam melhor em sala de aula do que em sua própria casa, já que perdem muitas vezes a concentração, ou por motivos de costume.", "Portanto, indubitavelmente, medidas são necessárias para resolver esse problema. Cabe ao Ministério da Educação a iniciativa de desenvolver um aplicativo gratuito, oficial e offline nas lojas de aplicativo, contendo todos os materiais necessários para o estudo adequado dos jovens no Brasil. Confirmando assim o pensamento de Nelson Mandela, \"A educação é o grande motor do desenvolvimento pessoal\"."], "sistema": {"C1": 120, "C2": 120, "C3": 120, "C4": 120, "C5": 120}, "feedback": "<h3>Pontos fortes<\/h3><ul>\n<li><span class=c>C1:<\/span> Apresentou coerência temática ao discutir os desafios da Educação a Distância no Brasil.<\/li>\n<li><span class=c>C1:<\/span> Utilizou recursos de coesão textual, como conectivos (por exemplo, &quot;Além disso&quot;, &quot;Portanto&quot;), que ajudam na organização das ideias.<\/li>\n<li><span class=c>C2:<\/span> Você manteve o foco no tema proposto, abordando claramente os desafios da Educação a Distância no Brasil.<\/li>\n<li><span class=c>C2:<\/span> Sua proposta de solução (um aplicativo gratuito e offline) está articulada ao final do texto, demonstrando tentativa de conclusão coerente.<\/li>\n<li><span class=c>C3:<\/span> Você trouxe dados do contexto da pandemia, mostrando compreensão do tema proposto.<\/li>\n<li><span class=c>C3:<\/span> Apresentou uma proposta concreta (aplicativo gratuito) que demonstra tentativa de defesa de ponto de vista.<\/li>\n<li><span class=c>C4:<\/span> A estrutura geral do texto apresenta introdução, desenvolvimento e conclusão, o que impede que a nota seja ainda menor.<\/li>\n<li><span class=c>C4:<\/span> O uso de conectivos como &quot;Além de&quot; e &quot;Portanto&quot; demonstra tentativa de articular ideias entre os parágrafos.<\/li>\n<li><span class=c>C5:<\/span> Você identificou corretamente a necessidade de uma ação institucional para melhorar a Educação a Distância, demonstrando compreensão do tema.<\/li>\n<li><span class=c>C5:<\/span> A proposta está articulada ao final do texto, conectando‑se à discussão desenvolvida ao longo da redação.<\/li>\n<\/ul><h3>O que corrigir, trecho a trecho<\/h3><ol>\n<li>&ldquo;A educação sempre foi um tema polêmico dentro do país, mas hodiernamente tem se falado muito mais sobre a situação dela após as medidas tomadas durante a pandemia d covid-19.&rdquo;<ul>\n<li><span class=c>C3:<\/span> O trecho mistura informações gerais com a situação atual sem estabelecer uma sequência lógica; a introdução não delimita claramente o foco da argumentação, o que prejudica a organização das ideias.<br><i>Sugestão:<\/i> A educação sempre foi um tema polêmico no Brasil; entretanto, a pandemia de Covid‑19 trouxe novos desafios, tornando urgente discutir a situação da educação à distância.<\/li>\n<\/ul><\/li>\n<li>&ldquo;O distanciamento social, medida essencial para evitar o contágio, fez com que todas as escolas e faculdades parassem com suas atividades, o que provocou um grande problema em relação aos estudos de crianças e jovens brasileiros.&rdquo;<ul>\n<li><span class=c>C4:<\/span> O trecho contém uma sequência longa de informações sem a devida divisão por conectivos adequados; a relação de causa‑efeito entre a pausa das aulas e os problemas de aprendizagem não está explicitada por conectores de consequência, o que enfraquece a coesão entre as ideias.<br><i>Sugestão:<\/i> O distanciamento social, medida essencial para evitar o contágio, fez com que todas as escolas e faculdades parassem com suas atividades; consequentemente, surgiram grandes problemas nos estudos de crianças e jovens brasileiros.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Além de mudar drasticamente a rotina da maioria dos estudantes.&rdquo;<ul>\n<li><span class=c>C3:<\/span> A frase está isolada, sem conexão clara ao parágrafo anterior, gerando descontinuidade na sequência argumentativa.<br><i>Sugestão:<\/i> Além disso, a pandemia mudou drasticamente a rotina da maioria dos estudantes, exigindo adaptações rápidas ao ensino remoto.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Com essa pausa, muitos riscos a saúde deles foram abolidos .&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de concordância e regência: o verbo &quot;abolir&quot; não se aplica a &quot;riscos&quot; e a preposição correta é &quot;para&quot;. Além disso, há espaço antes do ponto final.<br><i>Sugestão:<\/i> Com essa pausa, muitos riscos à saúde deles foram eliminados.<\/li>\n<li><span class=c>C2:<\/span> O argumento não se relaciona diretamente ao tema da Educação a Distância; ao mencionar riscos à saúde que foram “abolidos”, o texto se desvia da proposta e não contribui para a construção da argumentação sobre os desafios da EAD.<br><i>Sugestão:<\/i> Com essa pausa, surgiram novos riscos à saúde mental dos estudantes, como o aumento da ansiedade e do isolamento, que também impactam o processo de aprendizagem a distância.<\/li>\n<\/ul><\/li>\n<li>&ldquo;algo que trás muitos desafios para a educação.&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de ortografia (trás → traz) e falta de concordância nominal; o verbo deve estar no presente do indicativo sem acento.<br><i>Sugestão:<\/i> algo que traz muitos desafios para a educação.<\/li>\n<li><span class=c>C2:<\/span> O argumento é vago e não apresenta desenvolvimento suficiente; falta explicitar quais são os desafios e como eles se relacionam com a EAD, o que impede uma argumentação consistente.<br><i>Sugestão:<\/i> algo que traz muitos desafios para a educação, como a falta de acesso à internet, a baixa qualidade da interação pedagógica e a dificuldade de acompanhamento dos estudantes.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Uma das soluções utilizadas pelos alunos foi optar pela educação a distância, modalidade educacional na qual alunos e professores estão separados, física ou temporalmente.&rdquo;<ul>\n<li><span class=c>C5:<\/span> O trecho apresenta a solução de forma genérica e não a transforma em proposta de intervenção; falta indicar quem deve promover a solução, como será feita a implementação e quais resultados se pretende alcançar.<br><i>Sugestão:<\/i> As escolas públicas devem adotar plataformas de aprendizagem híbrida, treinando professores para mediá‑las e fornecendo dispositivos móveis aos estudantes que não os possuem, de modo a reduzir a evasão escolar e melhorar a concentração dos alunos.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Para essa saída, obrigatoriamente, o aluno precisa de tecnologia e meio de comunicação.&rdquo;<ul>\n<li><span class=c>C1:<\/span> Uso inadequado de registro formal: a expressão &quot;Para essa saída&quot; é vaga e informal; além disso, o verbo &quot;precisar&quot; exige a preposição &quot;de&quot; seguida de artigo definido quando se refere a algo específico.<br><i>Sugestão:<\/i> Para essa solução, o aluno precisa de tecnologia e de meios de comunicação.<\/li>\n<li><span class=c>C2:<\/span> A ideia é apresentada de forma superficial, sem aprofundar as consequências da necessidade de tecnologia nem conectar esse ponto à tese central, enfraquecendo a coesão argumentativa.<br><i>Sugestão:<\/i> Para essa alternativa, o aluno precisa necessariamente de acesso a dispositivos tecnológicos e a meios de comunicação estáveis, o que exclui grande parte da população estudantil de baixa renda.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Portanto, indubitavelmente, medidas são necessárias para resolver esse problema.&rdquo;<ul>\n<li><span class=c>C3:<\/span> A conclusão apresenta uma afirmação genérica e não retoma os argumentos desenvolvidos ao longo do texto, faltando coerência na defesa do ponto de vista.<br><i>Sugestão:<\/i> Portanto, é imprescindível que o Ministério da Educação implemente políticas específicas, como a criação de um aplicativo gratuito e offline, para garantir a continuidade dos estudos de todos os jovens brasileiros.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Cabe ao Ministério da Educação a iniciativa de desenvolver um aplicativo gratuito, oficial e offline nas lojas de aplicativo, contendo todos os materiais necessários para o estudo adequado dos jovens no Brasil.&rdquo;<ul>\n<li><span class=c>C5:<\/span> A proposta não especifica claramente o agente (quem executa a ação), a ação concreta, o modo/meio de implementação, o efeito esperado e o detalhamento necessário para que a intervenção seja viável e respeite os direitos humanos.<br><i>Sugestão:<\/i> O Ministério da Educação, em parceria com universidades públicas e organizações da sociedade civil, deve criar e disponibilizar gratuitamente um aplicativo oficial, com versão offline, que contenha todo o material didático obrigatório, garantindo acesso universal a estudantes de baixa renda e respeitando a privacidade e a inclusão digital.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Existe muitas plataformas digitais de estudo gratuitas, porém, o grande problema é que nem todos possuem a mesma condição financeira para cobrir os custos devido a esse tipo de educação.&rdquo;<ul>\n<li><span class=c>C4:<\/span> A conjunção &quot;porém&quot; está isolada por vírgulas desnecessárias e a relação entre a existência de plataformas gratuitas e a dificuldade financeira não está bem articulada; faltam conectivos que estabeleçam contraste e explicação de forma clara.<br><i>Sugestão:<\/i> Existem muitas plataformas digitais de estudo gratuitas; porém, o grande problema é que nem todos têm condições financeiras para arcar com os custos associados a esse tipo de educação.<\/li>\n<\/ul><\/li>\n<\/ol><h3>Como melhorar<\/h3><ul>\n<li><span class=c>C1:<\/span> Revisar as regras de concordância verbal e nominal, bem como a regência de verbos comuns como &quot;abolir&quot;, &quot;precisar&quot; e &quot;eliminar&quot;.<\/li>\n<li><span class=c>C1:<\/span> Atenção à ortografia de palavras homófonas (ex.: traz/trás) e ao uso correto de acentuação.<\/li>\n<li><span class=c>C1:<\/span> Praticar a escrita em registro formal, evitando expressões vagas ou coloquiais e revisando a pontuação para eliminar espaços desnecessários antes de pontos finais.<\/li>\n<li><span class=c>C2:<\/span> Desenvolva cada argumento com exemplos concretos e dados que demonstrem a gravidade dos desafios (ex.: falta de internet, desigualdade de acesso a dispositivos).<\/li>\n<li><span class=c>C2:<\/span> Estabeleça relações claras entre os problemas apontados e a proposta de solução, mostrando como o aplicativo proposto poderia mitigar esses obstáculos.<\/li>\n<li><span class=c>C2:<\/span> Organize o texto em parágrafos bem estruturados, garantindo que cada um contenha uma ideia central, desenvolvimento e ligação lógica com o próximo parágrafo.<\/li>\n<li><span class=c>C3:<\/span> Estruture o texto em introdução, desenvolvimento e conclusão, garantindo que cada parágrafo tenha um objetivo claro e esteja conectado ao anterior.<\/li>\n<li><span class=c>C3:<\/span> Selecione e organize as informações de forma lógica, apresentando dados, exemplos e argumentos que sustentem seu ponto de vista de maneira progressiva.<\/li>\n<li><span class=c>C3:<\/span> Desenvolva a autoria ao inserir sua voz crítica, propondo soluções originais e justificando-as com base nos argumentos já apresentados.<\/li>\n<li><span class=c>C4:<\/span> Utilize conectivos de causa, consequência, contraste e adição de forma precisa, evitando sequências extensas sem pontuação adequada.<\/li>\n<li><span class=c>C4:<\/span> Varie os recursos de coesão referencial (pronomes, sinônimos, elipses) para evitar repetições e garantir a fluidez entre os parágrafos.<\/li>\n<li><span class=c>C4:<\/span> Planeje a estrutura de cada parágrafo antes de escrever, garantindo que cada um contenha uma ideia central ligada ao anterior por um conectivo explícito.<\/li>\n<li><span class=c>C5:<\/span> Detalhe todos os elementos da proposta (agente, ação, modo/meio, efeito e detalhamento) para que a intervenção seja completa e viável.<\/li>\n<li><span class=c>C5:<\/span> Apresente dados ou exemplos concretos que justifiquem a necessidade da medida, reforçando o respeito aos direitos humanos (acesso universal, inclusão digital).<\/li>\n<li><span class=c>C5:<\/span> Conecte a proposta diretamente aos argumentos desenvolvidos no corpo do texto, mostrando como ela resolve os problemas apontados.<\/li>\n<\/ul>"}, {"cod": "F05", "tema": "Parto humanizado: uma questão de saúde pública", "titulo": "(sem título)", "motivadores": "<p>Texto 1: Em meados dos anos 2000, alguns movimentos contrários à hospitalização do parto começaram a crescer no Brasil, questionando nossas altas taxas de cesáreas e excessivas intervenções nos partos, solicitando mais autonomia da paciente. Foi neste momento que o movimento do parto humanizado começou a crescer.<\/p><p>O parto humanizado é condição que respeita a gestante e o bebê, permite que sua autonomia seja levada em consideração, seja no parto vaginal, seja na cesárea, seja no fórceps. A maneira de nascimento não é o que determina essa humanização e, sim, o respeito com que a paciente é atendida.<\/p><p>Texto 2: Segurar o filho pela primeira vez é, para muitas mulheres, uma experiência única. Para tornar este momento ainda mais especial, o Hospital e Maternidade José Martiniano de Alencar (HMJMA), unidade de média complexidade da Secretaria de Saúde do Ceará (Sesa), do Governo do Estado, investe na humanização do atendimento. “As mães em trabalho de parto são nossa prioridade. Tudo é conduzido da forma mais humanizada possível”, destacou o obstetra Francisco Nogueira, coordenador da maternidade no HMJMA.<\/p><p>Texto 3: Segundo o Comitê, o parto humanizado deve ser realizado em um hospital, local mais adequado e seguro para mãe e para o bebê. “As complicações ocorrem em cerca de 10% dos casos. Entre eles estão: sangramento, elevação da pressão arterial materna, sofrimento fetal agudo e prolapso do cordão umbilical. Estas situações necessitam de atendimento médico imediato e local para tratamento apropriado da mãe e do bebê”, explica a médica obstétrica Dra. Dani WerKa.<\/p><p>Texto 4: O Brasil realiza quase quatro vezes mais cesáreas do que os 15% considerados aceitáveis pela Organização Mundial da Saúde (OMS). Por outro lado, faltam casas de parto normal no Sistema Único de Saúde (SUS). Em todo o território nacional, existem apenas 18 delas em funcionamento.<\/p><p>Mas que esses dados significam? Por que há tão poucas casas de parto no Brasil? Uma conclusão não totalmente óbvia: esse descaso demonstra que a política pública brasileira para maternidade se coloca não apenas a favor de procedimentos invasivos como contra a autonomia da mulher.<\/p>", "paragrafos": ["No contexto atual, o Brasil apresenta um número quatro vezes maior de cesáreas realizadas do que os 15% considerados aceitáveis pela OMS - Organização Mundial da Saúde- escancarando a falta de promoção a partos humanizados que garantem maior autonomia à gestante e mínima intervenção médica. Nesse sentido, no que tange a questão do parto humanizado, percebe-se a configuração de um grave problema na saúde pública em virtude das condições precárias do SUS - Sistema de Saúde Público- e a escassez de hospitais especializados para a realização de tal procedimento.", "Devido falta de infraestrutura, recursos e atendimento do SUS partos humanizados são dificilmente realizados pela carência de profissionais, instrumentos e salas especiais para esse atendimento, o que gera uma maior procura a partos com intervenção médica e com maiores riscos à gestante e ao bebê.", "Além disso, é nítido o descaso do governo em relação criação de hospitais especializados para o procedimento, considerando que no Brasil há apenas um hospital público especializado no parto em questão, o que dificulta o acesso de gestantes que optam pelo procedimento humanizado e que não possuem renda para pagar por ele em hospitais privados.", "Com isso, é nítido a necessidade de intervenções para sanar o problema. Portanto, cabe ao governo federal juntamente com o Ministério da Saúde promover melhorias ao Sistema de Saúde Público, como a criação de salas especiais, garantindo local e atendimento para gestantes, e a criação de hospitais especializados e direcionados humanização do parto. Tais medidas devem ser tomadas para minimizar a procura por cesáreas, e para a implementação de partos humanizados na sociedade brasileira."], "sistema": {"C1": 160, "C2": 120, "C3": 120, "C4": 160, "C5": 120}, "feedback": "<h3>Pontos fortes<\/h3><ul>\n<li><span class=c>C1:<\/span> Apresenta vocabulário adequado ao tema e mantém coerência argumentativa ao longo do texto.<\/li>\n<li><span class=c>C1:<\/span> Utiliza conectivos que garantem a progressão lógica das ideias, facilitando a leitura.<\/li>\n<li><span class=c>C2:<\/span> Apresenta claramente a proposta de intervenção ao final, indicando quem deve agir e quais medidas são necessárias.<\/li>\n<li><span class=c>C2:<\/span> Mantém o foco no tema &quot;parto humanizado&quot; ao longo do texto, sem fugir para assuntos alheios.<\/li>\n<li><span class=c>C3:<\/span> Apresenta dados relevantes sobre a taxa de cesáreas no Brasil, demonstrando conhecimento do tema.<\/li>\n<li><span class=c>C3:<\/span> Defende claramente a necessidade de políticas públicas para ampliar o parto humanizado.<\/li>\n<li><span class=c>C4:<\/span> Você utiliza conectivos como &quot;Nesse sentido&quot; e &quot;Além disso&quot;, o que demonstra tentativa de articular ideias entre os parágrafos.<\/li>\n<li><span class=c>C4:<\/span> Há variedade de recursos de referência (ex.: &quot;o que gera&quot;, &quot;com isso&quot;), indicando repertório diversificado de coesão.<\/li>\n<li><span class=c>C5:<\/span> Você identificou claramente o problema da baixa oferta de partos humanizados no SUS e relacionou-o ao alto índice de cesáreas no país.<\/li>\n<li><span class=c>C5:<\/span> Sua proposta menciona a criação de salas especiais e hospitais especializados, demonstrando tentativa de intervenção concreta.<\/li>\n<\/ul><h3>O que corrigir, trecho a trecho<\/h3><ol>\n<li>&ldquo;No contexto atual, o Brasil apresenta um número quatro vezes maior de cesáreas realizadas do que os 15% considerados aceitáveis pela OMS - Organização Mundial da Saúde- escancarando a falta de promoção a partos humanizados que garantem maior autonomia à gestante e mínima intervenção médica.&rdquo;<ul>\n<li><span class=c>C4:<\/span> O trecho apresenta duas ideias distintas (dados sobre cesáreas e crítica à falta de partos humanizados) ligadas apenas por um hífen e por &quot;escancarando&quot;, o que rompe a coesão entre as proposições. Falta um conectivo ou estrutura que estabeleça claramente a relação de causa‑efeito ou explicação.<br><i>Sugestão:<\/i> No contexto atual, o Brasil apresenta um número quatro vezes maior de cesáreas realizadas do que os 15% considerados aceitáveis pela OMS – Organização Mundial da Saúde –, o que escancara a falta de promoção de partos humanizados, capazes de garantir maior autonomia à gestante e mínima intervenção médica.<\/li>\n<\/ul><\/li>\n<li>&ldquo;escancarando a falta de promoção a partos humanizados&rdquo;<ul>\n<li><span class=c>C3:<\/span> O trecho apresenta a ideia de forma vaga e com construção sintática inadequada, dificultando a compreensão da relação entre a alta taxa de cesáreas e a ausência de políticas de parto humanizado. Falta clareza e coesão, o que compromete a organização das informações na defesa do ponto de vista.<br><i>Sugestão:<\/i> escancarando a falta de promoção de partos humanizados<\/li>\n<\/ul><\/li>\n<li>&ldquo;Devido falta de infraestrutura, recursos e atendimento do SUS partos humanizados são dificilmente realizados&rdquo;<ul>\n<li><span class=c>C1:<\/span> Erro de concordância e regência: falta o artigo definido após &#x27;Devido&#x27; (Devido à falta) e o verbo &#x27;ser&#x27; não concorda com o sujeito plural &#x27;partos humanizados&#x27;. Além disso, a pontuação está ausente antes de &#x27;partos humanizados&#x27;, gerando ambiguidade.<br><i>Sugestão:<\/i> Devido à falta de infraestrutura, recursos e atendimento do SUS, os partos humanizados são dificilmente realizados<\/li>\n<li><span class=c>C2:<\/span> A frase não estabelece claramente a relação de causa‑efeito entre a falta de infraestrutura e a dificuldade de realização dos partos humanizados, e a estrutura sintática impede a argumentação de ser fluida e persuasiva.<br><i>Sugestão:<\/i> Devido à falta de infraestrutura, recursos e atendimento do SUS, os partos humanizados são dificilmente realizados.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Devido falta de infraestrutura, recursos e atendimento do SUS partos humanizados são dificilmente realizados pela carência de profissionais, instrumentos e salas especiais para esse atendimento, o que gera uma maior procura a partos com intervenção médica e com maiores riscos à gestante e ao bebê.&rdquo;<ul>\n<li><span class=c>C5:<\/span> A intervenção proposta não apresenta o modo/meio (como será feita a capacitação ou a compra de equipamentos) nem o efeito esperado de forma mensurável; a descrição fica genérica e não demonstra articulação com a discussão desenvolvida no texto.<br><i>Sugestão:<\/i> Para suprir a falta de infraestrutura, o Ministério da Saúde destinará, a partir do próximo exercício, um fundo de R$ 200 milhões para a compra de equipamentos e a reforma de salas de parto em 500 unidades de saúde, garantindo a presença de doulas e obstetras treinados, o que deve reduzir em 10% a taxa de cesáreas evitáveis nos primeiros dois anos.<\/li>\n<\/ul><\/li>\n<li>&ldquo;Com isso, é nítido a nece
